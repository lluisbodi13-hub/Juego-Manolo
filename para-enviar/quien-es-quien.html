<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<title>Quién es Quién Financiero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,600;6..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Concepto: billete de banco. Papel verde pálido, tinta verde de seguridad, fondos guilloché en el reverso de las fichas, acento dorado. */
:root{
  --paper:#EAF0E6; --panel:#F8FAF4; --ink:#0D2A21; --ink-2:#47615A; --line:#C6D4C9;
  --green:#0F5A44; --on-green:#FFFFFF; --gold:#A87412; --gold-soft:#F2E4BC;
  --ok:#1B7A47; --ok-soft:#D8EEDF; --bad:#B0342C; --bad-soft:#F6DAD6;
  --g-int:#1D5E8E; --g-nac:#A33A45; --g-eur:#4A3E9E;
  --back-a:#0F5A44; --back-b:#3B8C70;
  --f-display:'Bodoni Moda',Georgia,'Times New Roman',serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0A1613; --panel:#12241E; --ink:#E7F1EB; --ink-2:#9FB7AC; --line:#26433B;
    --green:#5FCBA3; --on-green:#06140F; --gold:#E6B24A; --gold-soft:#3A2F14;
    --ok:#6FD79A; --ok-soft:#173825; --bad:#F08A80; --bad-soft:#40201C;
    --g-int:#74B4E6; --g-nac:#EA8F98; --g-eur:#ABA0F4;
    --back-a:#1B4A3B; --back-b:#2F7A61; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0A1613; --panel:#12241E; --ink:#E7F1EB; --ink-2:#9FB7AC; --line:#26433B;
  --green:#5FCBA3; --on-green:#06140F; --gold:#E6B24A; --gold-soft:#3A2F14;
  --ok:#6FD79A; --ok-soft:#173825; --bad:#F08A80; --bad-soft:#40201C;
  --g-int:#74B4E6; --g-nac:#EA8F98; --g-eur:#ABA0F4;
  --back-a:#1B4A3B; --back-b:#2F7A61; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
.shell{max-width:1180px;margin-inline:auto;padding-inline:16px;padding-block:14px 40px;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
p{margin:0}

/* barra superior */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 18px;padding-bottom:12px;border-bottom:2px solid var(--ink)}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.15rem;letter-spacing:.01em}
.brand small{display:block;font-family:var(--f-mono);font-weight:500;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.pips{display:flex;gap:6px;list-style:none;margin:0;padding:0}
.pips li{font-family:var(--f-mono);font-size:.68rem;min-width:1.9rem;height:1.9rem;display:grid;place-items:center;border:1.5px solid var(--line);border-radius:50%;color:var(--ink-2)}
.pips li.done{background:var(--green);border-color:var(--green);color:var(--on-green)}
.pips li.cur{border-color:var(--gold);color:var(--gold);font-weight:600;box-shadow:0 0 0 3px var(--gold-soft)}
.stats{display:flex;gap:14px;font-family:var(--f-mono);font-size:.85rem;font-variant-numeric:tabular-nums}
.stats b{font-weight:600;color:var(--gold)}

/* botones */
.btn{border:2px solid var(--green);background:var(--green);color:var(--on-green);font-weight:700;padding:.7rem 1.3rem;border-radius:999px;transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--green)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

/* intro */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:28px;align-items:center}
.guil{aspect-ratio:1;max-width:100%;border-radius:50%;border:2px solid var(--ink);
  background:
    repeating-radial-gradient(circle at 38% 42%, transparent 0 5px, var(--back-b) 5px 6px),
    repeating-radial-gradient(circle at 62% 58%, transparent 0 5px, var(--back-a) 5px 6px),
    var(--panel);
  display:grid;place-items:center;position:relative}
.guil span{font-family:var(--f-display);font-weight:800;font-size:clamp(3rem,10vw,6.5rem);background:var(--panel);width:46%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;border:2px solid var(--ink);color:var(--gold)}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2)}
.hero h1{font-size:clamp(2.3rem,6vw,4.2rem);font-weight:800;margin-block:6px 14px}
.hero p.lead{font-size:1.1rem;max-width:52ch;color:var(--ink-2)}
.steps{list-style:none;margin:22px 0;padding:0;display:grid;gap:10px;max-width:56ch}
.steps li{display:grid;grid-template-columns:2rem 1fr;gap:10px;align-items:baseline}
.steps b{font-family:var(--f-mono);color:var(--gold)}
.route{display:flex;flex-wrap:wrap;gap:8px;margin-block:4px 22px;padding:0;list-style:none}
.route li{border:1.5px solid var(--line);border-radius:8px;padding:6px 10px;font-size:.85rem;background:var(--panel)}
.route li b{font-family:var(--f-mono);font-size:.7rem;color:var(--gold);margin-right:6px}
.best{font-family:var(--f-mono);font-size:.8rem;color:var(--ink-2);margin-top:12px}

/* juego */
.rhead h2{font-size:1.8rem;font-weight:800}
.rhead .hint{color:var(--ink-2);margin-top:4px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:22px;align-items:start}
.board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.card{perspective:800px;border:0;background:none;padding:0;text-align:center}
.card .in{position:relative;display:block;aspect-ratio:3/4;transition:transform .6s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.card.down .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:10px;overflow:hidden}
.front{background:var(--panel);border:1.5px solid var(--line);border-top:5px solid var(--gc);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:6px 5px}
.card:hover:not(.down) .front{border-color:var(--gc)}
.card.sel .front{box-shadow:0 0 0 3px var(--gold);border-color:var(--gold)}
.sig{font-family:var(--f-mono);font-weight:600;font-size:.74rem;color:var(--gc);border:2px solid var(--gc);border-radius:999px;min-width:2.9rem;padding:.35rem .5rem;line-height:1}
.sig.l{font-size:.6rem}
.nm{font-size:.68rem;line-height:1.15;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto}
.back{transform:rotateY(180deg);border:1.5px solid var(--ink);
  background:
    repeating-radial-gradient(circle at 30% 30%, transparent 0 3px, var(--back-b) 3px 4px),
    repeating-radial-gradient(circle at 70% 70%, var(--back-a) 0 3px, transparent 3px 6px),
    var(--back-a)}
.g-I{--gc:var(--g-int)} .g-N{--gc:var(--g-nac)} .g-E{--gc:var(--g-eur)}

.panel{display:flex;flex-direction:column;gap:12px;position:sticky;top:12px;min-width:0}
.secret{display:grid;grid-template-columns:4.2rem 1fr;gap:12px;align-items:center;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:10px}
.secret .mini{aspect-ratio:3/4;border-radius:8px;border:1.5px solid var(--ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.8rem;color:var(--gold);
  background:repeating-radial-gradient(circle at 30% 30%, var(--back-a) 0 3px, var(--back-b) 3px 4px)}
.secret .mini i{font-style:normal;background:var(--panel);width:2rem;height:2rem;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--ink)}
.stat{font-family:var(--f-mono);font-size:.78rem;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px}
.stat b{color:var(--ink);font-weight:600}
.guess{background:var(--gold-soft);border:1.5px solid var(--gold);border-radius:12px;padding:12px;display:grid;gap:8px}
.guess .row{display:flex;gap:8px;flex-wrap:wrap}
.last{border:1.5px solid var(--line);border-radius:12px;padding:12px;background:var(--panel);min-height:5.4rem}
.last.yes{border-color:var(--ok);background:var(--ok-soft)}
.last.no{border-color:var(--bad);background:var(--bad-soft)}
.verdict{font-family:var(--f-display);font-weight:800;font-size:1.5rem;margin-right:8px}
.last.yes .verdict{color:var(--ok)} .last.no .verdict{color:var(--bad)}
.last .q{font-weight:600;font-size:.9rem}
.last .note{font-size:.85rem;color:var(--ink-2);margin-top:4px}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:.3rem .8rem;font-size:.8rem;font-weight:600}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.qs{list-style:none;margin:0;padding:0;display:grid;gap:6px;max-height:19rem;overflow-y:auto;padding-right:2px}
.qb{width:100%;text-align:left;border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:.55rem .75rem;font-size:.9rem;display:flex;justify-content:space-between;gap:10px;align-items:center}
.qb:hover:not(:disabled){border-color:var(--green)}
.qb:disabled{cursor:default;color:var(--ink-2)}
.qb .r{font-family:var(--f-mono);font-weight:600;flex:none}
.qb.y .r{color:var(--ok)} .qb.n .r{color:var(--bad)}

/* ficha y test */
.ficha{display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px;align-items:start}
.ficha .card{pointer-events:none}
.res{font-family:var(--f-mono);font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ok)}
.ficha h2{font-size:2.1rem;font-weight:800;margin-block:4px 10px}
.desc{max-width:62ch;font-size:1.05rem}
.quiz{margin-top:22px;border-top:2px solid var(--ink);padding-top:16px;max-width:62ch}
.quiz h3{font-size:1.3rem;margin-block:4px 12px}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:.65rem .9rem}
.opt:hover:not(:disabled){border-color:var(--green)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.expl{margin-top:12px;color:var(--ink-2);font-size:.95rem}
.next{margin-top:16px}
.end{max-width:700px;display:grid;gap:14px}
.end h1{font-size:clamp(2.2rem,6vw,3.6rem);font-weight:800}
.big{font-family:var(--f-mono);font-size:3rem;font-weight:600;color:var(--gold);font-variant-numeric:tabular-nums}
.sum{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:.95rem}
.sum li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding-block:4px}
.sum span:last-child{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:10px}
.react{position:fixed;inset:0;display:grid;place-items:center;z-index:20;padding-inline:16px;cursor:pointer;overflow:hidden}
.react::before{content:"";position:absolute;inset:0;background:var(--panel);opacity:0;pointer-events:none}
.react.on::before{animation:flash .45s ease-out}
.react.win{background:repeating-conic-gradient(from 0deg at 50% 50%, color-mix(in srgb,var(--gold) 38%,transparent) 0 10deg, transparent 10deg 20deg)}
.react.shout,.react.laugh{background:color-mix(in srgb,var(--bad) 30%,color-mix(in srgb,var(--ink) 40%,transparent))}
.react .box{position:relative;z-index:1;display:grid;gap:14px;justify-items:center;text-align:center;width:min(94vw,56rem);padding:clamp(22px,4vw,44px) clamp(18px,4vw,48px);border-radius:24px;border:4px solid var(--ink);background:var(--panel);box-shadow:0 16px 0 var(--ink),0 40px 90px color-mix(in srgb,var(--ink) 45%,transparent)}
.react small{font-family:var(--f-mono);font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;padding:.25rem .8rem;border-radius:99px;color:var(--paper);background:var(--ink)}
.react h2{font-family:var(--f-display);font-weight:800;font-size:clamp(2.4rem,9vw,6.2rem);line-height:.95;letter-spacing:-.01em;text-wrap:balance;margin:0}
.react p{font-size:clamp(1.15rem,2.8vw,1.9rem);font-weight:600;line-height:1.3;text-wrap:balance;max-width:34ch;margin:0}
.react em{font-style:normal;font-family:var(--f-mono);font-size:.72rem;color:var(--ink-2)}
.react .tick{position:absolute;left:0;right:0;overflow:hidden;white-space:nowrap;font-family:var(--f-mono);font-weight:600;font-size:clamp(.85rem,2vw,1.15rem);padding-block:10px;color:var(--paper);background:var(--ink)}
.react .tick.top{top:env(safe-area-inset-top,0px)} .react .tick.bot{bottom:env(safe-area-inset-bottom,0px)}
.react .tick div{display:inline-block;animation:tape 14s linear infinite}
.react .tick.bot div{animation-direction:reverse}
.react .tick span{padding-inline:2rem}
.react.win .tick{background:var(--ok)} .react.shout .tick,.react.laugh .tick{background:var(--bad)}
.react.win .box{border-color:var(--gold);box-shadow:0 16px 0 var(--gold),0 40px 90px color-mix(in srgb,var(--ink) 45%,transparent)} .react.win h2{color:var(--gold)} .react.win small{background:var(--gold)}
.react.shout .box,.react.laugh .box{border-color:var(--bad);box-shadow:0 16px 0 var(--bad),0 40px 90px color-mix(in srgb,var(--ink) 45%,transparent)} .react.shout h2,.react.laugh h2{color:var(--bad)} .react.shout small,.react.laugh small{background:var(--bad)}
.react.on .box{animation:jump .7s cubic-bezier(.2,1.5,.35,1) both}
.react.on.win .box{animation:jump .7s cubic-bezier(.2,1.5,.35,1) both,throb 1.1s .7s ease-in-out infinite}
.react.on.shout,.react.on.laugh{animation:quake .5s .55s 3}
.react.on p{animation:slam .45s .4s cubic-bezier(.2,1.6,.4,1) both}
@keyframes tape{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
@keyframes jump{0%{transform:scale(.04) rotate(-28deg);opacity:0}45%{transform:scale(1.22) rotate(5deg);opacity:1}62%{transform:scale(.93) rotate(-3deg)}80%{transform:scale(1.05) rotate(1deg)}100%{transform:scale(1) rotate(0)}}
@keyframes throb{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
@keyframes quake{0%,100%{transform:translate(0,0)}15%{transform:translate(-18px,8px) rotate(-1.2deg)}30%{transform:translate(16px,-10px) rotate(1deg)}45%{transform:translate(-12px,6px)}60%{transform:translate(10px,-6px)}80%{transform:translate(-6px,3px)}}
@keyframes slam{0%{transform:translateY(60px) scale(.6);opacity:0}100%{transform:none;opacity:1}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:19}
.snd{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:.15rem .7rem;font-family:var(--f-mono);font-size:.75rem}
.cool{display:grid;gap:6px;font-family:var(--f-mono);font-size:.8rem;color:var(--ink-2)}
.cool .bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.cool .bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .2s linear}
.cool.ready{color:var(--ok)}
.qs.wait .qb:not(.y):not(.n){opacity:.5}
@media (prefers-reduced-motion:reduce){.react.on .box,.react.on p,.react.on,.react.on::before,.react .tick div{animation:none}}
.card[aria-disabled="true"]{cursor:default}
.how{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.78rem;color:var(--ink-2)}
.how b{font-family:var(--f-mono);color:var(--gold);margin-right:5px}
.guess.idle{background:transparent;border-style:dashed;border-color:var(--line);color:var(--ink-2);font-size:.9rem}
.guess .small{font-size:.8rem}
.last .out{font-family:var(--f-mono);font-size:.75rem;color:var(--ink);margin-top:6px}
.tab i{font-style:normal;font-family:var(--f-mono);font-size:.7rem;background:var(--gold-soft);color:var(--ink);border-radius:99px;padding:0 .4rem;margin-left:2px}
.tab i.zero{background:transparent;color:var(--ink-2)}
.qhead{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);padding:8px 2px 0}
.qb.useless{opacity:.45;border-style:dashed}

.clue{margin-top:10px;display:grid;gap:6px;padding:14px 18px;border-radius:14px;border:2px solid var(--gold);background:var(--gold-soft);max-width:60rem}
.clue small{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.clue p{font-family:var(--f-display);font-weight:800;font-size:clamp(1.3rem,3vw,2rem);line-height:1.15;text-wrap:balance;color:var(--ink)}
.rhead .hint{margin-top:8px}
.ptitle{font-family:var(--f-body);font-weight:700;font-size:1rem;margin:4px 0 0}
.recap{margin-top:18px;max-width:62ch}
.recap ul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px}
.recap li{display:grid;grid-template-columns:4.2rem 1fr;gap:10px;align-items:baseline;font-size:.92rem;padding-block:3px;border-bottom:1px dashed var(--line)}
.recap b{font-family:var(--f-mono);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--gold)}
.recap b.y{color:var(--ok)} .recap b.n{color:var(--bad)}
.toast{font-family:var(--f-mono);font-size:.8rem;color:var(--ok);min-height:1.2rem}

@media (max-width:900px){
  .hero{grid-template-columns:1fr}
  .guil{max-width:240px;order:-1}
  .cols{grid-template-columns:1fr}
  .panel{position:static}
  .board{grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
  .nm{font-size:.62rem;-webkit-line-clamp:5}
  .qs{max-height:none}
  .ficha{grid-template-columns:1fr}
  .ficha .card{max-width:170px}
}
@media (prefers-reduced-motion:reduce){
  .card .in{transition:none}.btn{transition:none}
}
</style>

<div class="shell" lang="es">
  <header class="top">
    <div class="brand">Quién es Quién<small>Sistema financiero internacional</small></div>
    <ol class="pips" id="pips" aria-label="Progreso"></ol>
    <div class="stats"><span><b id="sc">0</b> pts</span><span id="tm">00:00</span><button class="snd" id="snd" aria-pressed="true">Sonido: sí</button></div>
  </header>
  <main id="view"></main>
  <div class="react" id="react" hidden aria-live="assertive"></div>
  <canvas id="fx" hidden></canvas>
</div>

<script>
(function(){
'use strict';

/* ---------- DATOS ---------- */
const CARDS=[
 {id:'fmi',n:'Fondo Monetario Internacional',s:'FMI',g:'I',d:'Creado en 1944 en Bretton Woods, con sede en Washington. Supervisa las políticas económicas y monetarias de sus miembros, promueve el empleo y el comercio con estabilidad cambiaria y presta a países con desequilibrios en la Balanza de Pagos. Sus recursos son las cuotas de los socios, según su PIB, que también fijan su número de votos. Creó los Derechos Especiales de Giro (DEG).'},
 {id:'bm',n:'Banco Mundial',s:'BM',g:'I',d:'Organismo de la ONU creado en 1944, con sede en Washington (antes BIRF). Concede créditos a bajo interés, sin ánimo de lucro, a países en vías de desarrollo o que han sufrido catástrofes. Sus objetivos son el crecimiento, las infraestructuras y el sector privado. Para prestar exige ser socio del BM y del FMI y que el proyecto sea prioritario y no dañe el medio ambiente.'},

function pickQuiz(){
  const seen=[QS[S.clue].s].concat(S.order.map(id=>QS[id].q+' '+QS[id].n)).join(' ');
  const clash=qz=>{const m=QUIZ_AVOID.find(([k])=>qz.q.startsWith(k));return m?m[1].test(seen):false;};
  const fresh=qz=>!S.usedQ.includes(qz.q);
  let c=ROUNDS[S.r].quiz.filter(q=>fresh(q)&&!clash(q));
  if(!c.length) c=ROUNDS.flatMap(r=>r.quiz).filter(q=>fresh(q)&&!clash(q));
  if(!c.length) c=ROUNDS[S.r].quiz.filter(fresh);
  if(!c.length) c=ROUNDS[S.r].quiz;
  const qz=c[Math.floor(Math.random()*c.length)]; S.usedQ.push(qz.q); return qz;
}

}
function tone(t,f,d,o){
  o=o||{}; const a=AC, os=a.createOscillator(), g=a.createGain(), v=o.vol||.18, at=o.at||.012;
  os.type=o.type||'sine'; os.frequency.setValueAtTime(f,t);
  if(o.f2) os.frequency.exponentialRampToValueAtTime(o.f2,t+d);
  if(o.vib){const l=a.createOscillator(), lg=a.createGain(); l.frequency.value=o.vr||6; lg.gain.value=o.vib; l.connect(lg); lg.connect(os.frequency); l.start(t); l.stop(t+d+.05);}
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(v,t+at);
  g.gain.setValueAtTime(v,t+Math.max(at,d*.75)); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  let out=g;
  if(o.lp){const fl=a.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=o.lp; os.connect(fl); fl.connect(g);} else os.connect(g);
  if(o.dist){const w=a.createWaveShaper(); w.curve=curve(); g.connect(w); out=w;}
  out.connect(master); os.start(t); os.stop(t+d+.05);
}
function noise(t,d,o){
  o=o||{}; const a=AC, len=Math.ceil(a.sampleRate*d), buf=a.createBuffer(1,len,a.sampleRate), ch=buf.getChannelData(0);
  for(let i=0;i<len;i++) ch[i]=Math.random()*2-1;
  const src=a.createBufferSource(); src.buffer=buf;
  const fl=a.createBiquadFilter(); fl.type=o.type||'bandpass'; fl.frequency.setValueAtTime(o.f||1000,t); fl.Q.value=o.q||1;
  if(o.f2) fl.frequency.exponentialRampToValueAtTime(o.f2,t+d);
  const g=a.createGain(), v=o.vol||.2, at=o.at||.02;
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(v,t+at); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  src.connect(fl); fl.connect(g); g.connect(master); src.start(t); src.stop(t+d+.05);
}
let CURVE=null;
function curve(){if(CURVE)return CURVE;const n=1024,c=new Float32Array(n);for(let i=0;i<n;i++){const x=i/(n-1)*2-1;c[i]=Math.tanh(x*5);}return CURVE=c;}

const VW={a:[800,1150,2900],e:[450,1900,2600],i:[300,2300,3000],o:[480,820,2800],u:[330,720,2500]};
function vox(t,d,f0,f1,v,o){
  o=o||{}; const a=AC, F=VW[v], vol=o.vol||.25, at=o.at||.015;
  const s=a.createOscillator(); s.type='sawtooth';
  s.frequency.setValueAtTime(f0,t); s.frequency.exponentialRampToValueAtTime(f1||f0,t+d);
  if(o.vib){const l=a.createOscillator(),lg=a.createGain();l.frequency.value=o.vr||5.5;lg.gain.value=o.vib;l.connect(lg);lg.connect(s.frequency);l.start(t);l.stop(t+d+.05);}
  const env=a.createGain();
  env.gain.setValueAtTime(.0001,t); env.gain.exponentialRampToValueAtTime(vol,t+at); env.gain.setValueAtTime(vol,t+Math.max(at,d*.6)); env.gain.exponentialRampToValueAtTime(.0001,t+d);
  F.forEach((f,i)=>{const bp=a.createBiquadFilter();bp.type='bandpass';bp.frequency.value=f*(o.fs||1);bp.Q.value=5;const gg=a.createGain();gg.gain.value=[4,2.6,1.2][i];s.connect(bp);bp.connect(gg);gg.connect(env);});
  let out=env;
  if(o.dist){const w=a.createWaveShaper();w.curve=curve();env.connect(w);out=w;}
  out.connect(master);
  if(o.echo){const dl=a.createDelay(1),fb=a.createGain();dl.delayTime.value=o.echo;fb.gain.value=.35;out.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(master);}

}

function stadium(t,d){

function confetti(){

  const c=$('#fx'), x=c.getContext('2d'); c.width=innerWidth; c.height=innerHeight; c.hidden=false;
  const cs=getComputedStyle(document.documentElement), cols=['--gold','--green','--g-int','--g-nac','--g-eur'].map(k=>cs.getPropertyValue(k).trim());
  const P=[];
  [[.5,.5,0],[.2,.6,.5],[.8,.6,.9],[.5,.35,1.4]].forEach(([ox,oy,dl])=>{for(let i=0;i<110;i++)P.push({x:c.width*ox,y:c.height*oy,vx:(Math.random()-.5)*18,vy:-Math.random()*16-4,r:Math.random()*6+4,c:cols[Math.floor(Math.random()*cols.length)],a:Math.random()*6,d:dl*1000});});
  const t0=performance.now();
  (function f(now){
    const k=now-t0; x.clearRect(0,0,c.width,c.height);
    P.forEach(p=>{if(k<p.d)return;p.vy+=.42;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.a+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore();});

  })(t0);
}

   +'<ol class="steps">'
   +'<li><b>1</b><span>Hay 24 organismos en el tablero y uno es el secreto. Cada ronda empieza con una pista sobre él.</span></li>'
   +'<li><b>2</b><span>Si dudas entre varios, pide otra pista (una cada 15 segundos). Las fichas que no encajan se dan la vuelta solas.</span></li>'
   +'<li><b>3</b><span>¿Lo tienes? Toca la ficha y confirma. Cada pista extra resta 4 puntos y cada fallo, 12.</span></li>'
   +'<li><b>4</b><span>Lee la ficha de estudio y responde una pregunta de repaso. Son 8 rondas y la última vale el doble. Sube el volumen.</span></li></ol>'
   +'<ul class="route"><li><b>R1</b>Ronda 1</li><li><b>R2</b>Ronda 2</li><li><b>R3</b>Ronda 3</li><li><b>R4</b>Ronda 4</li><li><b>R5</b>Ronda 5</li><li><b>R6</b>Ronda 6</li><li><b>R7</b>Ronda 7</li><li><b>F</b>Ronda final ×2</li></ul>'
   +'<button class="btn" id="go">Empezar la partida</button>'
   +'<p class="best">Duración aproximada: 25 a 30 minutos.'+(best?' Tu mejor puntuación: '+best+' pts.':'')+'</p>'
   +'</div><div class="guil" aria-hidden="true"><span>?</span></div></section>';
  $('#go').onclick=()=>{S=newState();setScore();startTimer();startRound(0);};
}

/* ---------- RONDA ---------- */
function usefulCount(q){let y=0;S.alive.forEach(c=>{if(q.y.includes(c))y++;});return y>0&&y<S.alive.size;}
function startRound(i){
  const R=ROUNDS[i];
  const secret=R.pool[Math.floor(Math.random()*R.pool.length)];
  // Pista inicial: un dato concreto del secreto que comparten de 2 a 10 fichas, para orientar sin resolver
  let fits=QS.filter(q=>!q.b&&q.y.includes(secret)&&q.y.length>=2&&q.y.length<=10);
  if(!fits.length) fits=QS.filter(q=>q.y.includes(secret)&&q.y.length>=2&&q.y.length<=10);
  const clue=(fits.length?fits:QS.filter(q=>q.y.includes(secret)))[Math.floor(Math.random()*(fits.length||1))];
  Object.assign(S,{r:i,mult:i===ROUNDS.length-1?2:1,secret,clue:clue.id,order:[],alive:new Set(CARDS.map(c=>c.id)),asked:{},last:null,sel:null,rs:100,nq:0,nwrong:0,tab:null,nextAt:0,cooling:false});
  clearInterval(cdTimer); cdTimer=setInterval(tickCool,200);
  pips(i); setScore();
  view.innerHTML='<section class="play"><div class="rhead"><p class="eyebrow">'+(i===ROUNDS.length-1?'Ronda final · ¡los puntos valen el doble!':'Ronda '+(i+1)+' de '+ROUNDS.length)+'</p><div class="clue"><small>Pista inicial</small><p>'+esc(clue.s)+'</p></div><p class="hint">¿Quién es? Si lo sabes, toca su ficha. Si dudas entre varios, pide otra pista.</p></div>'
   +'<div class="cols"><div><div class="board" id="board">'+CARDS.map(c=>cardHtml(c)).join('')+'</div></div>'
   +'<aside class="panel"><div class="secret"><div class="mini" aria-hidden="true"><i>?</i></div><div><b>Organismo secreto</b><div class="stat" id="stat"></div></div></div>'
   +'<ol class="how"><li><b>1</b>Lee la pista inicial</li><li><b>2</b>Si dudas, pide otra pista: se giran las fichas que no encajan</li><li><b>3</b>Toca tu ficha y confirma</li></ol>'
   +'<div class="guess" id="guess"></div>'
   +'<div class="last" id="last" aria-live="polite"></div>'
   +'<h3 class="ptitle">Pide otra pista</h3><div class="cool" id="cool"><span id="coolt"></span><span class="bar"><i id="coolbar"></i></span></div><div class="tabs" id="tabs" role="tablist"></div><ul class="qs" id="qs"></ul></aside></div></section>';
  $('#board').onclick=e=>{
    const b=e.target.closest('.card'); if(!b||!S.alive.has(b.dataset.id)) return;
    S.sel=S.sel===b.dataset.id?null:b.dataset.id; paint();
  };
  $('#tabs').onclick=e=>{const b=e.target.closest('.tab'); if(!b) return; S.tab=b.dataset.c; paint();};
  $('#qs').onclick=e=>{const b=e.target.closest('.qb'); if(!b||b.disabled) return; ask(+b.dataset.q);};
  $('#guess').onclick=e=>{
    const b=e.target.closest('button'); if(!b) return;
    if(b.dataset.a==='no'){S.sel=null;paint();} else if(b.dataset.a==='yes'){guess(S.sel);}
  };
  paint();
  window.scrollTo({top:0});
}
function ask(id){
  const q=QS[id]; if(S.asked[id]!==undefined||Date.now()<S.nextAt) return;
  S.nextAt=Date.now()+COOLDOWN; S.cooling=true;
  const ans=q.y.includes(S.secret);
  S.asked[id]=ans; S.order.push(id); S.nq++; S.rs=Math.max(10,S.rs-PER_Q);
  let out=0;
  S.alive.forEach(cid=>{ if(q.y.includes(cid)!==ans){ S.alive.delete(cid); out++; } });
  if(S.sel&&!S.alive.has(S.sel)) S.sel=null;
  S.last={q:q.q,ans,note:q.n,out};
  paint(); tickCool();
}
function tickCool(){
  if(!S||!$('#cool')) return;
  const rem=S.nextAt-Date.now();
  if(rem>0){
    $('#cool').className='cool'; $('#coolt').textContent='Siguiente pista en '+Math.ceil(rem/1000)+' s. Mientras, puedes adivinar.';
    $('#coolbar').style.width=(100-rem/COOLDOWN*100)+'%';
  } else {
    $('#cool').className='cool ready'; $('#coolt').textContent='Ya puedes pedir otra pista'; $('#coolbar').style.width='100%';
    if(S.cooling){S.cooling=false; paint();}
  }
}
function guess(id){
  if(!id) return;
  if(id===S.secret){ S.rs*=S.mult; S.total+=S.rs; setScore(); react(true); finishRound(); return; }
  S.alive.delete(id); S.nwrong++; S.rs=Math.max(10,S.rs-PER_WRONG); S.sel=null;
  S.last={wrong:BY[id].n};
  react(false);
  paint();
}
function paint(){
  document.querySelectorAll('#board .card').forEach(el=>{
    const on=S.alive.has(el.dataset.id);
    el.classList.toggle('down',!on);
    el.classList.toggle('sel',S.sel===el.dataset.id);
    el.tabIndex=on?0:-1;
    el.setAttribute('aria-disabled',String(!on));
  });
  paintPanel();
}
function paintPanel(){
  $('#stat').innerHTML='<span>Candidatos: <b>'+S.alive.size+'</b></span><span>Pistas: <b>'+S.nq+'</b></span><span>Ronda: <b>'+S.rs+'</b> pts'+(S.mult>1?' ×2':'')+'</span>';
  const g=$('#guess');
  if(S.sel){
    g.className='guess';
    g.innerHTML='<b>¿Es «'+esc(BY[S.sel].n)+'»?</b><div class="row"><button class="btn" data-a="yes">Sí, es este</button><button class="btn ghost" data-a="no">Cancelar</button></div><span class="small">Si fallas pierdes '+PER_WRONG+' puntos.</span>';
  } else if(S.alive.size===1){
    const only=[...S.alive][0];
    g.className='guess';
    g.innerHTML='<b>Solo queda «'+esc(BY[only].n)+'».</b><div class="row"><button class="btn" data-a="yes" id="lastone">¡Es este!</button></div>';
    $('#lastone').onclick=e=>{e.stopPropagation();guess(only);};
  } else {
    g.className='guess idle';
    g.innerHTML='<span>¿Ya lo sabes? Toca una ficha del tablero para adivinar.</span>';
  }
  const L=$('#last');
  if(!S.last){L.className='last';L.innerHTML='<p class="q">Aún no has pedido más pistas.</p><p class="note">Las pistas de arriba de cada pestaña son las que descartan alguna ficha. Las mejores dejan fuera a la mitad.</p>';}
  else if(S.last.wrong){L.className='last no';L.innerHTML='<span class="verdict">Fallo</span><span class="q">«'+esc(S.last.wrong)+'» no es el organismo secreto.</span><p class="note">Esa ficha sale del tablero.</p>';}
  else{L.className='last '+(S.last.ans?'yes':'no');L.innerHTML='<span class="verdict">'+(S.last.ans?'Sí':'No')+'</span><span class="q">'+esc(S.last.q)+'</span><p class="note">'+esc(S.last.note)+'</p><p class="out">'+(S.last.out===1?'Se ha girado 1 ficha.':'Se han girado '+S.last.out+' fichas.')+'</p>';}
  const cnt={}; CATS.forEach(c=>{cnt[c[0]]=QS.filter(q=>q.c===c[0]&&q.id!==S.clue&&S.asked[q.id]===undefined&&usefulCount(q)).length;});
  if(!S.tab) S.tab=(CATS.find(c=>cnt[c[0]]>0)||CATS[0])[0];
  $('#tabs').innerHTML=CATS.map(c=>'<button class="tab" role="tab" data-c="'+c[0]+'" aria-selected="'+(S.tab===c[0])+'">'+c[1]+' <i class="'+(cnt[c[0]]?'':'zero')+'">'+cnt[c[0]]+'</i></button>').join('');
  const list=QS.filter(q=>q.c===S.tab&&q.id!==S.clue);
  const asked=list.filter(q=>S.asked[q.id]!==undefined), open=list.filter(q=>S.asked[q.id]===undefined);
  const good=open.filter(usefulCount), bad=open.filter(q=>!usefulCount(q));
  const btn=(q,dis,extra)=>{const a=S.asked[q.id];return '<li><button class="qb'+(a===undefined?'':(a?' y':' n'))+(extra||'')+'" data-q="'+q.id+'"'+(dis?' disabled':'')+'><span>'+esc(q.q)+'</span>'+(a===undefined?'':'<span class="r">'+(a?'SÍ':'NO')+'</span>')+'</button></li>';};
  $('#qs').classList.toggle('wait',S.cooling);
  $('#qs').innerHTML=(good.length?good.map(q=>btn(q,S.cooling)).join(''):'<li class="qhead">En esta pestaña ya no quedan pistas útiles. Prueba otra.</li>')
    +(asked.length?'<li class="qhead">Pistas ya pedidas</li>'+asked.map(q=>btn(q,true)).join(''):'')
    +(bad.length?'<li class="qhead">No descartan a nadie ahora</li>'+bad.map(q=>btn(q,true,' useless')).join(''):'');
}

/* ---------- FICHA + REPASO ---------- */
function finishRound(){
  clearInterval(cdTimer);
  const R=ROUNDS[S.r], c=BY[S.secret];
  S.log.push({t:R.t,pts:S.rs,nq:S.nq,wrong:S.nwrong});
  view.innerHTML='<section class="ficha"><div class="board" style="grid-template-columns:1fr">'+cardHtml(c)+'</div><div>'
   +'<p class="res">Acertaste · +'+S.rs+' pts'+(S.mult>1?' (doble)':'')+' · '+S.nq+(S.nq===1?' pista extra':' pistas extra')+'</p><h2>'+esc(c.n)+'</h2><p class="eyebrow">Ficha de estudio · '+esc(R.sec)+': '+esc(R.t)+'</p><p class="desc">'+esc(c.d)+'</p>'
   +'<div class="recap"><p class="eyebrow">Pistas de esta ronda</p><ul><li><b>Inicial</b><span>'+esc(QS[S.clue].s)+'</span></li>'
   +S.order.map(id=>'<li><b class="'+(S.asked[id]?'y':'n')+'">'+(S.asked[id]?'Sí':'No')+'</b><span>'+esc(QS[id].q)+'</span></li>').join('')+'</ul></div>'
   +'<div class="quiz" id="quizbox"></div></div></section>';
  showQuiz(pickQuiz());
  window.scrollTo({top:0});
}
function showQuiz(qz){
  $('#quizbox').innerHTML='<p class="eyebrow">Pregunta de repaso · +15 pts</p><h3>'+esc(qz.q)+'</h3><div class="opts" id="opts">'
   +qz.o.map((o,k)=>'<button class="opt" data-k="'+k+'">'+esc(o)+'</button>').join('')+'</div><p class="expl" id="expl" hidden></p><div class="next" id="nx" hidden></div>';
  $('#opts').onclick=e=>{
    const b=e.target.closest('.opt'); if(!b||b.disabled) return;
    answerMC(qz,+b.dataset.k,15,()=>{S.quizOk++;});
    const lastR=S.r===ROUNDS.length-1, nextFinal=S.r===ROUNDS.length-2;
    $('#nx').hidden=false;
    $('#nx').innerHTML='<button class="btn" id="nb">'+(lastR?'Ver mi resultado':nextFinal?'Empezar la ronda final':'Empezar la ronda '+(S.r+2))+'</button>';
    $('#nb').onclick=()=>{ if(lastR) end(); else startRound(S.r+1); };
  };
}
function answerMC(qz,k,pts,onOk){
  const ok=k===qz.a;
  document.querySelectorAll('#opts .opt').forEach((el,i)=>{
    el.disabled=true;
    if(i===qz.a) el.classList.add('right'); else if(i===k) el.classList.add('wrong');
  });
  if(ok){S.total+=pts;setScore();if(onOk)onOk();}
  react(ok);
  const ex=$('#expl'); ex.hidden=false;
  ex.textContent=(ok?'Correcto. ':'No era esa. ')+qz.e;
}

/* ---------- FINAL ---------- */
function rank(p){return p>=820?'Gobernador del Banco Central':p>=660?'Gestor de carteras':p>=460?'Analista junior':'Becario de ventanilla';}
function end(){
  clearInterval(timer);
  const mins=Math.max(1,Math.round((Date.now()-S.t0)/60000));
  const prev=getBest(); const record=S.total>prev; if(record) setBest(S.total);
  pips(ROUNDS.length);
  const txt='Jugué ¿Quién es quién? Versión financiera y saqué '+S.total+' puntos en '+mins+' min. Rango: '+rank(S.total)+'. ¿Me superas?';
  view.innerHTML='<section class="end"><p class="eyebrow">Partida terminada · '+fmt(Date.now()-S.t0)+'</p><h1>'+rank(S.total)+'</h1>'
   +'<div class="big">'+S.total+' pts</div>'+(record?'<p class="res">Nuevo récord personal</p>':'')
   +'<ul class="sum">'+S.log.map((l,i)=>'<li><span>'+(i===ROUNDS.length-1?'Final':'R'+(i+1))+' · '+esc(l.t)+' ('+l.nq+(l.nq===1?' pista, ':' pistas, ')+l.wrong+(l.wrong===1?' fallo)':' fallos)')+'</span><span>+'+l.pts+'</span></li>').join('')
   +'<li><span>Preguntas de repaso acertadas</span><span>'+S.quizOk+' / '+ROUNDS.length+'</span></li></ul>'
   +'<div class="row"><button class="btn" id="again">Jugar otra vez</button><button class="btn ghost" id="cp">Copiar mi resultado</button></div><p class="toast" id="ts" role="status"></p>'
   +'<p style="color:var(--ink-2);font-size:.9rem">Para retar a otra persona, envíale el enlace de este juego junto con tu resultado.</p></section>';
  $('#again').onclick=intro;
  $('#cp').onclick=()=>{
    const done=m=>{$('#ts').textContent=m;};
    try{
      navigator.clipboard.writeText(txt).then(()=>done('Resultado copiado.'),()=>done(txt));
    }catch(e){done(txt);}
  };
  window.scrollTo({top:0});
}

$('#react').onclick=()=>{$('#react').hidden=true;};
$('#snd').onclick=()=>{soundOn=!soundOn; try{localStorage.setItem(SND_KEY,soundOn?'on':'off')}catch(e){} if(!soundOn){try{speechSynthesis.cancel()}catch(e){}} else ac(); paintSound();};
paintSound();
intro();
})();
</script>
