<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}</style>
</head>
<body>
<title>Escape Offshore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@700;800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Concepto: cámara acorazada de un banco offshore de noche. Acero azul oscuro, latón en placas y cerraduras, turquesa caribeño para lo que se abre. Diseño oscuro a propósito (una sola apariencia). */
:root{
  --bg:#0C1822; --steel:#152634; --steel-2:#1E3446; --edge:#2E4A60;
  --text:#E9EFF3; --muted:#93A8B8; --brass:#D2AE57; --brass-2:#8C6F2A;
  --sea:#33C2BC; --ok:#62D394; --bad:#F2766B;
  --f-display:'Big Shoulders Stencil Display','Impact','Arial Narrow',sans-serif;
  --f-body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.5;
  background-image:radial-gradient(ellipse at 50% -20%,color-mix(in srgb,var(--sea) 14%,transparent),transparent 60%),repeating-linear-gradient(90deg,transparent 0 79px,color-mix(in srgb,var(--edge) 35%,transparent) 79px 80px)}
.app{max-width:1100px;margin-inline:auto;padding-inline:16px;padding-block:14px 48px;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:800;letter-spacing:.02em;line-height:1;margin:0;text-wrap:balance}
p{margin:0}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 18px;padding-bottom:12px;border-bottom:2px solid var(--edge)}
.brand{font-family:var(--f-display);font-size:1.5rem;color:var(--brass);letter-spacing:.06em}
.brand small{display:block;font-family:var(--f-mono);font-size:.62rem;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
.hud{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-family:var(--f-mono);font-size:.85rem}
.pill{border:1.5px solid var(--edge);border-radius:999px;padding:.25rem .8rem;background:var(--steel)}
.clock{font-family:var(--f-mono);font-weight:700;font-size:1.4rem;color:var(--brass);border:2px solid var(--brass-2);border-radius:10px;padding:.15rem .7rem;background:#000a;font-variant-numeric:tabular-nums;min-width:6ch;text-align:center}
.clock.low{color:var(--bad);border-color:var(--bad);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.55}}
.btn{border:2px solid var(--brass);background:var(--brass);color:#1a1405;font-weight:800;padding:.7rem 1.3rem;border-radius:10px;letter-spacing:.02em}
.btn.ghost{background:transparent;color:var(--brass)}
.btn.sea{background:var(--sea);border-color:var(--sea);color:#04201f}
.btn:disabled{opacity:.4;cursor:not-allowed}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.mute{border:1.5px solid var(--edge);background:transparent;border-radius:999px;padding:.2rem .7rem;font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}

/* intro */
.intro{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:start}
.intro h1{font-size:clamp(3rem,9vw,6rem);color:var(--text)}
.intro h1 span{color:var(--brass)}
.story{font-size:1.08rem;color:var(--muted);max-width:56ch;margin-top:14px}
.story b{color:var(--text)}
.setup{background:var(--steel);border:2px solid var(--edge);border-radius:16px;padding:18px;display:grid;gap:14px}
.setup label{font-weight:700;font-size:.9rem}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice button{border:2px solid var(--edge);background:var(--steel-2);border-radius:12px;padding:12px;text-align:left;display:grid;gap:4px}
.choice button b{font-family:var(--f-display);font-size:1.5rem;letter-spacing:.04em}
.choice button span{font-size:.82rem;color:var(--muted)}
.choice button[aria-pressed="true"]{border-color:var(--brass);background:color-mix(in srgb,var(--brass) 14%,var(--steel-2))}
.setup input{width:100%;border:2px solid var(--edge);background:#0007;color:var(--text);border-radius:10px;padding:.6rem .8rem;font:inherit}
.rules{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:8px;max-width:58ch}
.rules li{display:grid;grid-template-columns:1.8rem 1fr;gap:8px}
.rules b{font-family:var(--f-mono);color:var(--brass)}

/* cámara: cajas */
.vault h2{font-size:clamp(2rem,5vw,3rem)}
.boxes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:14px}
.box{position:relative;border:2px solid var(--edge);border-radius:14px;background:linear-gradient(160deg,var(--steel-2),var(--steel));padding:14px 12px 16px;text-align:left;display:grid;gap:8px;min-height:13rem;box-shadow:inset 0 0 0 6px #0003}
.box:hover{border-color:var(--brass)}
.box .plate{font-family:var(--f-display);font-size:2.6rem;color:var(--brass);line-height:.9}
.box .t{font-weight:800;font-size:1rem;line-height:1.2}
.box .s{font-size:.8rem;color:var(--muted);line-height:1.3}
.box .lock{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:50%;border:3px solid var(--brass-2);display:grid;place-items:center;font-family:var(--f-mono);font-size:.7rem;color:var(--brass)}
.box .st{margin-top:auto;font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.box.open{border-color:var(--sea);background:linear-gradient(160deg,color-mix(in srgb,var(--sea) 18%,var(--steel-2)),var(--steel))}
.box.open .lock{border-color:var(--sea);color:var(--sea)}
.box.open .st{color:var(--sea)}
.digit{font-family:var(--f-mono);font-weight:700;font-size:2.2rem;color:var(--sea);line-height:1}
.doorcta{margin-top:18px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;border:2px dashed var(--brass-2);border-radius:14px;padding:14px 18px}
.slots{display:flex;gap:8px}
.slot{width:2.6rem;height:3.2rem;border-radius:8px;border:2px solid var(--edge);display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:1.5rem;background:#0008;color:var(--sea)}

/* prueba */
.pz-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:end}
.pz-head h2{font-size:clamp(2rem,5vw,3.2rem)}
.task{color:var(--muted);max-width:70ch;margin-top:6px}
.pool{display:flex;flex-wrap:wrap;gap:8px;padding:12px;border:2px dashed var(--edge);border-radius:14px;min-height:4rem;background:#0004}
.pool:empty::before{content:"Todas las tarjetas están colocadas. Pulsa Comprobar.";color:var(--muted);font-size:.9rem}
.chip{border:2px solid var(--edge);background:var(--steel-2);border-radius:10px;padding:.5rem .75rem;font-size:.9rem;font-weight:600;text-align:left;line-height:1.3;max-width:100%}
.chip:hover{border-color:var(--brass)}
.chip.sel{border-color:var(--brass);background:color-mix(in srgb,var(--brass) 22%,var(--steel-2));box-shadow:0 0 0 3px color-mix(in srgb,var(--brass) 35%,transparent)}
.chip.bad{border-color:var(--bad);animation:shake .4s}
.chip.good{border-color:var(--ok)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.buckets{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.bucket{border:2px solid var(--edge);border-radius:14px;background:var(--steel);padding:12px;display:flex;flex-direction:column;gap:8px;min-height:8rem;text-align:left}
.bucket.target{border-color:var(--brass);cursor:pointer}
.bucket.target:hover{background:color-mix(in srgb,var(--brass) 10%,var(--steel))}
.bucket h3{font-family:var(--f-body);font-weight:800;font-size:1rem;letter-spacing:0;line-height:1.25}
.bucket .in{display:flex;flex-direction:column;gap:6px}
.bucket .in .chip{font-size:.85rem}
.msg{min-height:1.6rem;font-weight:700}
.msg.bad{color:var(--bad)} .msg.ok{color:var(--ok)} .msg.info{color:var(--muted);font-weight:500}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.hintbox{border-left:4px solid var(--sea);background:color-mix(in srgb,var(--sea) 10%,transparent);padding:10px 14px;border-radius:0 10px 10px 0;font-size:.92rem}
.solved{border:2px solid var(--sea);border-radius:16px;padding:22px;display:grid;gap:10px;justify-items:start;background:color-mix(in srgb,var(--sea) 8%,var(--steel))}
.solved .digit{font-size:4rem}

/* puerta */
.door{display:grid;grid-template-columns:1fr minmax(0,340px);gap:24px;align-items:start}
.wheel{aspect-ratio:1;max-width:340px;width:100%;border-radius:50%;border:10px solid var(--brass-2);background:repeating-conic-gradient(var(--steel-2) 0 15deg,var(--steel) 15deg 30deg);display:grid;place-items:center;box-shadow:inset 0 0 0 14px #0006,0 0 40px #0008}
.wheel .hub{width:42%;aspect-ratio:1;border-radius:50%;background:var(--brass);display:grid;place-items:center;font-family:var(--f-display);font-size:2.6rem;color:#1a1405}
.wheel.spin{animation:spin 1.4s cubic-bezier(.4,1.6,.5,1)}
@keyframes spin{to{transform:rotate(540deg)}}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:300px}
.keypad button{border:2px solid var(--edge);background:var(--steel-2);border-radius:10px;padding:.8rem 0;font-family:var(--f-mono);font-weight:700;font-size:1.3rem}
.keypad button:hover{border-color:var(--brass)}
.code{display:flex;gap:8px;margin-block:10px 14px}

/* final */
.end{display:grid;gap:14px;max-width:720px}
.end h1{font-size:clamp(3rem,9vw,5.5rem)}
.end .win{color:var(--sea)} .end .lose{color:var(--bad)}
.stats{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.stats li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--edge);padding-block:5px}
.stats span:last-child{font-family:var(--f-mono)}
.toast{font-family:var(--f-mono);font-size:.8rem;color:var(--ok);min-height:1.2rem}
.flash{position:fixed;inset:0;pointer-events:none;z-index:30;background:var(--bad);opacity:0}
.flash.go{animation:fl .5s}
@keyframes fl{0%{opacity:.35}100%{opacity:0}}

@media (max-width:900px){
  .intro,.door{grid-template-columns:1fr}
  .boxes{grid-template-columns:repeat(2,minmax(0,1fr))}
  .box{min-height:10rem}
  .box:last-child{grid-column:span 2}
}
@media (prefers-reduced-motion:reduce){.chip.bad,.wheel.spin,.clock.low,.flash.go{animation:none}}
</style>

<div class="app" lang="es">
  <header class="bar">
    <div class="brand">ESCAPE OFFSHORE<small>UP 1 · El Euromercado</small></div>
    <div class="hud" id="hud"><button class="mute" id="mute" aria-pressed="true">Sonido: sí</button></div>
  </header>
  <main id="view"></main>
</div>
<div class="flash" id="flash"></div>

<script>
(function(){
'use strict';
/* ---------- CONTENIDO (temario UP 1: El Euromercado) ---------- */
const LEVELS={
  facil:{name:'Fácil',time:25*60,pen:20,hints:2,hintCost:0,showWrong:true,desc:'25 minutos · todo en español · se marcan las tarjetas mal colocadas · 2 pistas gratis por caja'},
  dificil:{name:'Difícil',time:20*60,pen:45,hints:1,hintCost:90,showWrong:false,desc:'20 minutos · parte en inglés · solo se dice cuántos errores hay · cada pista cuesta 90 s'}
};
// lv: 'b' = los dos niveles, 'd' = solo difícil. en = texto en inglés que se usa en el nivel difícil.
const PUZZLES=[
 {n:1,title:'El expediente',sub:'Definición, características y conceptos',digit:6,why:'El Euromercado tiene 6 características.',
  task:'Clasifica cada afirmación como verdadera o falsa.',
  buckets:[{id:'V',t:'Verdadero',en:'True'},{id:'F',t:'Falso',en:'False'}],
  items:[
   {t:'En el Euromercado se opera en divisas distintas a las del país donde está el mercado.',a:'V',lv:'b'},
   {t:'El Euromercado es un mercado minorista para pequeños ahorradores.',a:'F',lv:'b',why:'Es mayorista: gobiernos, instituciones y grandes empresas.'},
   {t:'Pueden participar tanto residentes como no residentes.',a:'V',lv:'b'},
   {t:'Uno de sus objetivos es concentrar todo el riesgo en un solo país.',a:'F',lv:'b',why:'Busca la distribución del riesgo.'},
   {t:'El mercado de divisas es un mercado no organizado (OTC).',a:'V',lv:'b'},
   {t:'En el mercado secundario los títulos se compran a precio de emisión.',a:'F',lv:'b',why:'Se compran a precio de mercado.'},
   {t:'The Euromarket is authorised by the Central Bank of each country.',a:'V',lv:'d'},
   {t:'Solvency means being able to pay only short-term debts.',a:'F',lv:'d',why:'Eso es la liquidez. La solvencia es pagar todas las deudas con todos los activos.'}
  ],
  hint:'Fíjate en las palabras «minorista», «concentrar» y «precio de emisión»: suelen esconder el error.'},
 {n:2,title:'El mapa offshore',sub:'Áreas geográficas del Euromercado',digit:5,why:'El Euromercado se reparte en 5 áreas geográficas.',
  task:'Lleva cada centro financiero a su área geográfica.',
  buckets:[{id:'EU',t:'Europa Occidental',en:'Western Europe'},{id:'CA',t:'El Caribe y América Central',en:'Caribbean & Central America'},{id:'OM',t:'Oriente Medio',en:'Middle East'},{id:'LO',t:'Lejano Oriente',en:'Far East'},{id:'US',t:'Estados Unidos',en:'United States'}],
  items:[
   {t:'Londres',en:'London',a:'EU',lv:'b'},{t:'Luxemburgo',en:'Luxembourg',a:'EU',lv:'b'},{t:'Zúrich',en:'Zurich',a:'EU',lv:'d'},
   {t:'Bahamas',a:'CA',lv:'b'},{t:'Islas Caimán',en:'Cayman Islands',a:'CA',lv:'b'},{t:'Panamá',en:'Panama',a:'CA',lv:'d'},
   {t:'Qatar',a:'OM',lv:'b'},{t:'Emiratos Árabes Unidos',en:'United Arab Emirates',a:'OM',lv:'d'},
   {t:'Tokio',en:'Tokyo',a:'LO',lv:'b'},{t:'Singapur',en:'Singapore',a:'LO',lv:'d'},{t:'Hong Kong',a:'LO',lv:'d'},
   {t:'Nueva York',en:'New York',a:'US',lv:'b'}
  ],
  hint:'Zúrich, Ámsterdam y Luxemburgo están en Europa. Bahamas, Caimán y Panamá, en el Caribe y Centroamérica.'},
 {n:3,title:'Fija o variable',sub:'Renta fija frente a renta variable',digit:2,why:'Hay 2 tipos de renta: fija y variable.',
  task:'¿Esta característica es de la renta fija o de la renta variable?',
  buckets:[{id:'RF',t:'Renta fija (bono)',en:'Fixed income (bond)'},{id:'RV',t:'Renta variable (acción)',en:'Equity (share)'}],
  items:[
   {t:'Sabes de antemano la rentabilidad que vas a obtener',a:'RF',lv:'b'},
   {t:'Cobras un cupón o interés periódico',a:'RF',lv:'b'},
   {t:'Al vencimiento recuperas el nominal',a:'RF',lv:'b'},
   {t:'Riesgo bajo, perfil de inversor conservador',a:'RF',lv:'b'},
   {t:'La rentabilidad es incierta: depende de cómo vaya la empresa',a:'RV',lv:'b'},
   {t:'Puedes cobrar dividendos, pero no son fijos',a:'RV',lv:'b'},
   {t:'No tiene vencimiento: pasas a ser socio de la empresa',a:'RV',lv:'b'},
   {t:'Riesgo alto, perfil de inversor arriesgado',a:'RV',lv:'b'},
   {t:'Fixed coupon paid every year',a:'RF',lv:'d'},
   {t:'You become a shareholder',a:'RV',lv:'d'}
  ],
  hint:'Piensa en un bono: prestas dinero y te lo devuelven con intereses. Con una acción compras un trozo de la empresa.'},
 {n:4,title:'Cada producto a su sector',sub:'Sectores del Euromercado',digit:4,why:'El Euromercado tiene 4 sectores.',
  task:'Coloca cada producto en el sector del Euromercado donde se negocia.',
  buckets:[{id:'MO',t:'Monetario (corto plazo)',en:'Money market (short term)'},{id:'CP',t:'Capitales (medio y largo plazo)',en:'Capital market (medium & long term)'},{id:'CR',t:'Crédito (eurocréditos)',en:'Credit market (eurocredits)'},{id:'DI',t:'Divisas',en:'Foreign exchange'}],
  items:[
   {t:'Letras del Tesoro',en:'Treasury bills',a:'MO',lv:'b'},
   {t:'Pagarés de empresa (europapel)',en:'Commercial paper (Euro-CP)',a:'MO',lv:'b'},
   {t:'FRA: derivado a corto plazo sobre tipos de interés',a:'MO',lv:'d'},
   {t:'Eurobono',en:'Eurobond',a:'CP',lv:'b'},
   {t:'Euroacción',en:'Euro-equity',a:'CP',lv:'b'},
   {t:'Bono convertible en acciones',en:'Convertible bond',a:'CP',lv:'d'},
   {t:'Préstamo bancario a largo plazo a un gobierno, en euromonedas',a:'CR',lv:'b'},
   {t:'Crédito internacional simple',en:'Simple international loan',a:'CR',lv:'b'},
   {t:'Cambiar dólares por yenes',en:'Swap US dollars for yen',a:'DI',lv:'b'},
   {t:'Comprar libras con francos suizos',en:'Buy pounds with Swiss francs',a:'DI',lv:'d'}
  ],
  hint:'Corto plazo (máximo 12-18 meses) = monetario. Bonos y acciones a largo plazo = capitales. Préstamos de bancos = crédito.'},
 {n:5,title:'La emisión del eurobono',sub:'Quién hace qué en el sindicato bancario',digit:3,why:'El sindicato bancario tiene 3 piezas: director principal, aseguradores y bancos de venta.',
  task:'Une cada participante con lo que hace en la emisión de un eurobono.',
  cap:1,
  buckets:[
   {id:'EM',t:'Necesita los fondos y emite los eurobonos.'},
   {id:'LM',t:'Diseña la operación y elige a los bancos aseguradores.'},
   {id:'UW',t:'Garantiza la colocación y suscribe un porcentaje de la emisión.'},
   {id:'BV',t:'Coloca los bonos entre los inversores del Euromercado.'},
   {id:'CO',t:'Vigila y controla la emisión en nombre de los bonistas.'},
   {id:'AG',t:'Paga los cupones y presenta los títulos al emisor al amortizarlos.'}
  ],
  items:[
   {t:'Emisor',en:'Issuer',a:'EM',lv:'b'},
   {t:'Director principal',en:'Lead manager',a:'LM',lv:'b'},
   {t:'Bancos aseguradores',en:'Underwriters',a:'UW',lv:'b'},
   {t:'Bancos de venta',en:'Selling banks',a:'BV',lv:'b'},
   {t:'Comisario del sindicato de bonistas',en:'Bondholders’ trustee',a:'CO',lv:'b'},
   {t:'Agente del servicio financiero',en:'Paying agent',a:'AG',lv:'b'}
  ],
  hint:'El que «dirige» diseña la operación. Los que «aseguran» garantizan la colocación. El «agente» es el que paga.'}
];
const CODE=PUZZLES.map(p=>p.digit).join('');

/* ---------- SONIDO ---------- */
let soundOn=true; try{soundOn=localStorage.getItem('escape-snd')!=='off'}catch(e){}
let AC=null;
function ctx(){if(!soundOn)return null;try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();}if(AC.state==='suspended')AC.resume();return AC;}catch(e){return null;}}
function tone(f,d,o){const a=ctx();if(!a)return;o=o||{};const t=a.currentTime+(o.at||0),os=a.createOscillator(),g=a.createGain();os.type=o.type||'sine';os.frequency.setValueAtTime(f,t);if(o.f2)os.frequency.exponentialRampToValueAtTime(o.f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(o.v||.15,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);os.connect(g);g.connect(a.destination);os.start(t);os.stop(t+d+.05);}
const SFX={
  tap:()=>tone(660,.06,{type:'triangle',v:.08}),
  drop:()=>tone(330,.08,{type:'triangle',v:.1}),
  bad:()=>{tone(150,.35,{type:'sawtooth',v:.12});tone(110,.4,{type:'square',v:.06,at:.05});},
  open:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,.25,{type:'triangle',v:.12,at:i*.09}));tone(90,.3,{v:.3,at:.45,f2:50});},
  alarm:()=>{[0,.3,.6].forEach(at=>{tone(880,.22,{type:'square',v:.07,at});tone(660,.22,{type:'square',v:.07,at:at+.15});});},
  win:()=>{[392,523,659,784,1047].forEach((f,i)=>tone(f,.4,{type:'sawtooth',v:.08,at:i*.12}));[523,659,784].forEach(f=>tone(f,1.4,{type:'triangle',v:.06,at:.7}));}
};

/* ---------- ESTADO ---------- */
const $=s=>document.querySelector(s), view=$('#view');
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const fmt=s=>{s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};
let G=null, ticker=null, pick={level:'facil',mode:'grupo'};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function txt(o){return G&&G.level==='dificil'&&o.en?o.en:o.t;}
function itemsFor(p){return p.items.filter(it=>G.level==='dificil'||it.lv==='b');}
function newGame(){
  const L=LEVELS[pick.level];
  G={level:pick.level,mode:pick.mode,team:(($('#team')||{}).value||'').trim(),t0:Date.now(),extra:0,pen:0,errors:0,hints:0,solved:{},state:{},hintsLeft:{},msg:{},alarmed:false,over:false,entered:''};
  PUZZLES.forEach(p=>{const its=shuffle(itemsFor(p).map((it,i)=>({...it,k:p.n+'-'+i})));G.state[p.n]={order:its,place:{},sel:null,bad:{}};G.hintsLeft[p.n]=L.hints;});
  clearInterval(ticker); ticker=setInterval(tick,250);
}
function remaining(){const L=LEVELS[G.level];return L.time+G.extra-(Date.now()-G.t0)/1000-G.pen;}
function tick(){
  if(!G||G.over) return;
  const r=remaining(), c=$('#clock');
  if(c){c.textContent=fmt(r);c.classList.toggle('low',r<=60);}
  if(r<=60&&!G.alarmed){G.alarmed=true;SFX.alarm();}
  if(r<=0){G.over=true;end(false);}
}
function penalty(s){G.pen+=s;G.errors++;const f=$('#flash');f.classList.remove('go');void f.offsetWidth;f.classList.add('go');tick();}
function hud(){
  const L=G?LEVELS[G.level]:null;
  $('#hud').innerHTML=(G?'<span class="pill">'+esc(G.team||(G.mode==='solo'?'En solitario':'Equipo'))+' · '+L.name+'</span><span class="pill">Cajas '+Object.keys(G.solved).length+'/5</span><span class="clock" id="clock">'+fmt(remaining())+'</span>':'')
    +'<button class="mute" id="mute" aria-pressed="'+soundOn+'">'+(soundOn?'Sonido: sí':'Sonido: no')+'</button>';
  $('#mute').onclick=()=>{soundOn=!soundOn;try{localStorage.setItem('escape-snd',soundOn?'on':'off')}catch(e){}hud();};
}

/* ---------- PANTALLAS ---------- */
function intro(){
  G=null; clearInterval(ticker); hud();
  view.innerHTML='<section class="intro"><div>'
   +'<p class="eyebrow">Escape room · UP 1 El Euromercado</p>'
   +'<h1>Atrapados en el <span>paraíso fiscal</span></h1>'
   +'<p class="story">Medianoche en George Town, <b>Islas Caimán</b>. Sois auditores del Banco Central y estáis revisando la cámara acorazada del <b>Offshore Bank</b> cuando la puerta se cierra sola. El sistema de seguridad solo se desactiva con un <b>código de 5 dígitos</b>, y cada dígito está dentro de una caja fuerte.</p>'
   +'<ul class="rules">'
   +'<li><b>1</b><span>Abrid las 5 cajas en el orden que queráis. Cada una es una prueba del temario.</span></li>'
   +'<li><b>2</b><span>Tocad una tarjeta y después el sitio donde va. Cuando estén todas, pulsad «Comprobar».</span></li>'
   +'<li><b>3</b><span>Cada error resta tiempo. Las pistas ayudan, pero en el nivel difícil también cuestan tiempo.</span></li>'
   +'<li><b>4</b><span>Con los 5 dígitos, id a la puerta y teclead el código antes de que llegue a 00:00.</span></li></ul>'
   +'</div><div class="setup">'
   +'<label>Nivel</label><div class="choice" id="lv">'
   +Object.entries(LEVELS).map(([k,L])=>'<button data-k="'+k+'" aria-pressed="'+(pick.level===k)+'"><b>'+L.name+'</b><span>'+L.desc+'</span></button>').join('')+'</div>'
   +'<label>Modo</label><div class="choice" id="md"><button data-k="grupo" aria-pressed="'+(pick.mode==='grupo')+'"><b>En grupo</b><span>Equipos de 3 a 5. Podéis repartiros las cajas.</span></button><button data-k="solo" aria-pressed="'+(pick.mode==='solo')+'"><b>En solitario</b><span>Una persona resuelve las 5 cajas.</span></button></div>'
   +'<label for="team">Nombre del equipo o jugador</label><input id="team" maxlength="30" placeholder="Por ejemplo: Los Underwriters">'
   +'<button class="btn" id="go">Entrar en la cámara</button></div></section>';
  $('#lv').onclick=e=>{const b=e.target.closest('button');if(!b)return;pick.level=b.dataset.k;intro();};
  $('#md').onclick=e=>{const b=e.target.closest('button');if(!b)return;pick.mode=b.dataset.k;const t=$('#team').value;intro();$('#team').value=t;};
  $('#go').onclick=()=>{ctx();SFX.open();newGame();vault();};
}
function vault(){
  hud();
  const got=PUZZLES.map(p=>G.solved[p.n]?p.digit:'');
  view.innerHTML='<section class="vault"><p class="eyebrow">Cámara acorazada · Offshore Bank</p><h2>Elegid una caja fuerte</h2>'
   +'<div class="boxes">'+PUZZLES.map(p=>{const o=!!G.solved[p.n];return '<button class="box'+(o?' open':'')+'" data-n="'+p.n+'"><span class="lock">'+(o?'✓':'0'+p.n)+'</span><span class="plate">'+p.n+'</span><span class="t">'+esc(p.title)+'</span><span class="s">'+esc(p.sub)+'</span>'+(o?'<span class="digit">'+p.digit+'</span><span class="st">Abierta</span>':'<span class="st">Cerrada · '+itemsFor(p).length+' tarjetas</span>')+'</button>';}).join('')+'</div>'
   +'<div class="doorcta"><div><p class="eyebrow">Código de la puerta</p><div class="slots">'+got.map(d=>'<span class="slot">'+(d===''?'·':d)+'</span>').join('')+'</div></div><button class="btn sea" id="door">Ir a la puerta</button></div></section>';
  view.querySelector('.boxes').onclick=e=>{const b=e.target.closest('.box');if(!b)return;SFX.tap();puzzle(+b.dataset.n);};
  $('#door').onclick=()=>{SFX.tap();door();};
  window.scrollTo({top:0});
}
function puzzle(n){
  const p=PUZZLES[n-1], S=G.state[n], L=LEVELS[G.level];
  if(G.solved[n]){solvedView(p);return;}
  hud();
  const placed=k=>S.place[k];
  const chip=it=>'<button class="chip'+(S.sel===it.k?' sel':'')+(S.bad[it.k]?' bad':'')+'" data-k="'+it.k+'">'+esc(txt(it))+'</button>';
  const cost=L.hintCost?' (−'+L.hintCost+' s)':'';
  view.innerHTML='<section class="pz"><div class="pz-head"><div><p class="eyebrow">Caja '+n+' · '+esc(p.sub)+'</p><h2>'+esc(p.title)+'</h2><p class="task">'+esc(p.task)+' Toca una tarjeta y después su casilla. Para devolver una tarjeta, tócala otra vez.</p></div>'
   +'<button class="btn ghost" id="back">Volver a la cámara</button></div>'
   +'<div class="pool" id="pool">'+S.order.filter(it=>!placed(it.k)).map(chip).join('')+'</div>'
   +'<div class="buckets" id="bk">'+p.buckets.map(b=>'<div class="bucket'+(S.sel?' target':'')+'" data-b="'+b.id+'" role="button" tabindex="0"><h3>'+esc(txt(b))+'</h3><div class="in">'+S.order.filter(it=>placed(it.k)===b.id).map(chip).join('')+'</div></div>').join('')+'</div>'
   +'<p class="msg '+((G.msg[n]||{}).c||'info')+'" id="msg">'+esc((G.msg[n]||{}).t||'')+'</p>'
   +'<div class="actions"><button class="btn" id="chk">Comprobar</button><button class="btn ghost" id="hint"'+(G.hintsLeft[n]?'':' disabled')+'>Pista'+cost+' · quedan '+G.hintsLeft[n]+'</button></div>'
   +(S.hintShown?'<p class="hintbox">'+esc(p.hint)+'</p>':'')+'</section>';
  const sel=k=>{
    if(S.place[k]){delete S.place[k];S.sel=null;SFX.drop();}
    else S.sel=S.sel===k?null:k, SFX.tap();
    S.bad={}; puzzle(n);
  };
  const drop=bid=>{
    if(!S.sel) return;
    if(p.cap){Object.keys(S.place).forEach(k=>{if(S.place[k]===bid)delete S.place[k];});}
    S.place[S.sel]=bid; S.sel=null; SFX.drop(); puzzle(n);
  };
  view.querySelector('.pz').onclick=e=>{
    const c=e.target.closest('.chip'); if(c){e.stopPropagation();sel(c.dataset.k);return;}
    const b=e.target.closest('.bucket'); if(b) drop(b.dataset.b);
  };
  view.querySelectorAll('.bucket').forEach(b=>b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();drop(b.dataset.b);}});
  $('#back').onclick=e=>{e.stopPropagation();vault();};
  $('#chk').onclick=e=>{e.stopPropagation();check(p);};
  $('#hint').onclick=e=>{e.stopPropagation();hint(p);};
}
function check(p){
  const S=G.state[p.n], L=LEVELS[G.level];
  const left=S.order.filter(it=>!S.place[it.k]).length;
  if(left){G.msg[p.n]={c:'info',t:'Faltan '+left+(left===1?' tarjeta':' tarjetas')+' por colocar.'};puzzle(p.n);return;}
  const wrong=S.order.filter(it=>S.place[it.k]!==it.a);
  if(!wrong.length){G.solved[p.n]=true;G.msg[p.n]=null;SFX.open();solvedView(p);return;}
  SFX.bad(); penalty(L.pen);
  if(L.showWrong){S.bad={};wrong.forEach(it=>{delete S.place[it.k];S.bad[it.k]=true;});G.msg[p.n]={c:'bad',t:wrong.length+(wrong.length===1?' tarjeta estaba mal y ha vuelto':' tarjetas estaban mal y han vuelto')+' arriba. −'+L.pen+' s.'};}
  else G.msg[p.n]={c:'bad',t:'Hay '+wrong.length+(wrong.length===1?' error':' errores')+'. No te decimos cuáles. −'+L.pen+' s.'};
  puzzle(p.n);
}
function hint(p){
  const S=G.state[p.n], L=LEVELS[G.level];
  if(!G.hintsLeft[p.n]) return;
  G.hintsLeft[p.n]--; G.hints++; S.hintShown=true;
  if(L.hintCost){G.pen+=L.hintCost;}
  // coloca bien una tarjeta que esté sin colocar o mal colocada
  const it=S.order.find(x=>S.place[x.k]!==x.a);
  if(it){ if(p.cap) Object.keys(S.place).forEach(k=>{if(S.place[k]===it.a)delete S.place[k];}); S.place[it.k]=it.a; S.bad={}; }
  G.msg[p.n]={c:'info',t:'Pista: «'+txt(it||{t:''})+'» ya está en su sitio.'+(L.hintCost?' −'+L.hintCost+' s.':'')};
  SFX.tap(); tick(); puzzle(p.n);
}
function solvedView(p){
  hud();
  const extra=itemsFor(p).filter(it=>it.why);
  view.innerHTML='<section class="solved"><p class="eyebrow">Caja '+p.n+' abierta</p><h2>'+esc(p.title)+'</h2><p>Dentro de la caja hay un papel con un número:</p><span class="digit">'+p.digit+'</span><p>'+esc(p.why)+'</p>'
   +(extra.length?'<div class="hintbox"><b>Para recordar:</b> '+extra.map(it=>esc(it.why)).join(' ')+'</div>':'')
   +'<div class="actions"><button class="btn" id="back">Volver a la cámara</button>'+(Object.keys(G.solved).length===5?'<button class="btn sea" id="door">¡Ya tenéis los 5! Ir a la puerta</button>':'')+'</div></section>';
  $('#back').onclick=vault; const d=$('#door'); if(d) d.onclick=door;
  window.scrollTo({top:0});
}
function door(){
  hud();
  const got=PUZZLES.map(p=>G.solved[p.n]?p.digit:'·');
  view.innerHTML='<section class="door"><div><p class="eyebrow">Puerta de la cámara</p><h2 style="font-size:clamp(2rem,5vw,3.2rem)">Introducid el código</h2>'
   +'<p class="task">El código son los dígitos de las cajas 1 a 5, en orden. Dígitos encontrados: <b style="font-family:var(--f-mono);color:var(--sea)">'+got.join(' ')+'</b></p>'
   +'<div class="code">'+[0,1,2,3,4].map(i=>'<span class="slot">'+(G.entered[i]||'')+'</span>').join('')+'</div>'
   +'<div class="keypad" id="kp">'+[1,2,3,4,5,6,7,8,9,'Borrar',0,'Abrir'].map(k=>'<button data-k="'+k+'">'+k+'</button>').join('')+'</div>'
   +'<p class="msg" id="msg"></p><button class="btn ghost" id="back">Volver a la cámara</button></div>'
   +'<div class="wheel" id="wheel"><div class="hub">$</div></div></section>';
  $('#kp').onclick=e=>{
    const b=e.target.closest('button'); if(!b) return; const k=b.dataset.k;
    if(k==='Borrar'){G.entered=G.entered.slice(0,-1);SFX.drop();door();return;}
    if(k==='Abrir'){
      if(G.entered.length<5){$('#msg').className='msg info';$('#msg').textContent='Faltan dígitos.';return;}
      if(G.entered===CODE){G.over=true;clearInterval(ticker);SFX.win();$('#wheel').classList.add('spin');setTimeout(()=>end(true),1300);return;}
      SFX.bad(); penalty(LEVELS[G.level].pen); G.entered=''; door(); $('#msg').className='msg bad'; $('#msg').textContent='Código incorrecto. La alarma suena: −'+LEVELS[G.level].pen+' s.'; return;
    }
    if(G.entered.length<5){G.entered+=k;SFX.tap();door();}
  };
  $('#back').onclick=vault;
  window.scrollTo({top:0});
}
function end(win){
  clearInterval(ticker); hud();
  const r=Math.max(0,remaining()), used=LEVELS[G.level].time+G.extra-r;
  const solved=Object.keys(G.solved).length;
  const score=win?Math.round(r*(G.level==='dificil'?2:1))+solved*100:solved*100;
  const name=G.team||(G.mode==='solo'?'Jugador':'Equipo');
  const text=name+' '+(win?'escapó':'no escapó')+' de la cámara offshore (nivel '+LEVELS[G.level].name+') con '+score+' puntos.';
  view.innerHTML='<section class="end"><p class="eyebrow">'+(win?'Puerta abierta':'Tiempo agotado')+'</p>'
   +'<h1 class="'+(win?'win':'lose')+'">'+(win?'¡Habéis escapado!':'La puerta sigue cerrada')+'</h1>'
   +'<p class="story" style="margin:0">'+(win?'El código '+CODE+' desactiva la seguridad y salís al aire caliente de George Town con el informe de auditoría bajo el brazo.':'La inspección llega antes de que deis con el código. Podéis seguir con 5 minutos extra o volver a empezar.')+'</p>'
   +'<ul class="stats"><li><span>Equipo</span><span>'+esc(name)+'</span></li><li><span>Nivel</span><span>'+LEVELS[G.level].name+'</span></li><li><span>Cajas abiertas</span><span>'+solved+' / 5</span></li><li><span>Tiempo usado</span><span>'+fmt(used)+'</span></li><li><span>Errores</span><span>'+G.errors+'</span></li><li><span>Pistas</span><span>'+G.hints+'</span></li><li><span>Puntuación</span><span>'+score+'</span></li></ul>'
   +'<div class="actions">'+(win?'':'<button class="btn" id="more">Seguir 5 minutos más</button>')+'<button class="btn '+(win?'':'ghost')+'" id="again">Jugar otra vez</button><button class="btn ghost" id="cp">Copiar resultado</button></div><p class="toast" id="ts" role="status"></p></section>';
  if(win) SFX.win();
  const m=$('#more'); if(m) m.onclick=()=>{G.extra+=300;G.over=false;G.alarmed=false;ticker=setInterval(tick,250);vault();};
  $('#again').onclick=intro;
  $('#cp').onclick=()=>{try{navigator.clipboard.writeText(text).then(()=>{$('#ts').textContent='Resultado copiado.';},()=>{$('#ts').textContent=text;});}catch(e){$('#ts').textContent=text;}};
}
intro();
})();
</script>

</body>
</html>
