<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}</style>
</head>
<body>
<title>Escape Offshore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@700;800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Concepto: un banco offshore de noche, recorrido sala a sala. Acero azul oscuro, latón en placas y cerraduras, turquesa caribeño para lo que se abre. Diseño oscuro a propósito (una sola apariencia). */
:root{
  --bg:#0C1822; --steel:#152634; --steel-2:#1E3446; --edge:#2E4A60;
  --text:#E9EFF3; --muted:#93A8B8; --brass:#D2AE57; --brass-2:#8C6F2A;
  --sea:#33C2BC; --ok:#62D394; --bad:#F2766B;
  --f-display:'Big Shoulders Stencil Display','Impact','Arial Narrow',sans-serif;
  --f-body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.5;
  background-image:radial-gradient(ellipse at 50% -20%,color-mix(in srgb,var(--sea) 14%,transparent),transparent 60%),repeating-linear-gradient(90deg,transparent 0 79px,color-mix(in srgb,var(--edge) 35%,transparent) 79px 80px)}
.app{max-width:1100px;margin-inline:auto;padding-inline:16px;padding-block:14px 48px;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:800;letter-spacing:.02em;line-height:1;margin:0;text-wrap:balance}
p{margin:0}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 18px;padding-bottom:12px;border-bottom:2px solid var(--edge)}
.brand{font-family:var(--f-display);font-size:1.5rem;color:var(--brass);letter-spacing:.06em}
.brand small{display:block;font-family:var(--f-mono);font-size:.62rem;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
.hud{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-family:var(--f-mono);font-size:.85rem}
.pill{border:1.5px solid var(--edge);border-radius:999px;padding:.25rem .8rem;background:var(--steel)}
.clock{font-family:var(--f-mono);font-weight:700;font-size:1.4rem;color:var(--brass);border:2px solid var(--brass-2);border-radius:10px;padding:.15rem .7rem;background:#000a;font-variant-numeric:tabular-nums;min-width:6ch;text-align:center}
.clock.low{color:var(--bad);border-color:var(--bad);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.55}}
.btn{border:2px solid var(--brass);background:var(--brass);color:#1a1405;font-weight:800;padding:.7rem 1.3rem;border-radius:10px;letter-spacing:.02em}
.btn.ghost{background:transparent;color:var(--brass)}
.btn.sea{background:var(--sea);border-color:var(--sea);color:#04201f}
.btn:disabled{opacity:.4;cursor:not-allowed}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.mute{border:1.5px solid var(--edge);background:transparent;border-radius:999px;padding:.2rem .7rem;font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}

/* intro */
.intro{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:start}
.intro h1{font-size:clamp(3rem,9vw,6rem);color:var(--text)}
.intro h1 span{color:var(--brass)}
.story{font-size:1.08rem;color:var(--muted);max-width:56ch;margin-top:14px}
.story b{color:var(--text)}
.setup{background:var(--steel);border:2px solid var(--edge);border-radius:16px;padding:18px;display:grid;gap:14px}
.setup label{font-weight:700;font-size:.9rem}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice button{border:2px solid var(--edge);background:var(--steel-2);border-radius:12px;padding:12px;text-align:left;display:grid;gap:4px}
.choice button b{font-family:var(--f-display);font-size:1.5rem;letter-spacing:.04em}
.choice button span{font-size:.82rem;color:var(--muted)}
.choice button[aria-pressed="true"]{border-color:var(--brass);background:color-mix(in srgb,var(--brass) 14%,var(--steel-2))}
.setup input{width:100%;border:2px solid var(--edge);background:#0007;color:var(--text);border-radius:10px;padding:.6rem .8rem;font:inherit}
.rules{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:8px;max-width:58ch}
.rules li{display:grid;grid-template-columns:1.8rem 1fr;gap:8px}
.rules b{font-family:var(--f-mono);color:var(--brass)}

/* plano de salas */
.plan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.room{border:2px solid var(--edge);border-radius:14px;background:var(--steel);padding:12px 14px;display:grid;gap:4px;text-align:left}
.room b{font-family:var(--f-display);font-size:1.4rem;letter-spacing:.04em}
.room span{font-size:.8rem;color:var(--muted)}
.room.cur{border-color:var(--brass);background:color-mix(in srgb,var(--brass) 10%,var(--steel))}
.room.done{border-color:var(--sea)}
.room.done b{color:var(--sea)}
.room.locked{opacity:.45}

/* sala: pruebas */
.hall h2{font-size:clamp(2rem,5vw,3rem)}
.boxes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:14px}
.box{position:relative;border:2px solid var(--edge);border-radius:14px;background:linear-gradient(160deg,var(--steel-2),var(--steel));padding:14px 12px 16px;text-align:left;display:grid;gap:8px;min-height:12rem;box-shadow:inset 0 0 0 6px #0003}
.box:hover{border-color:var(--brass)}
.box .plate{font-family:var(--f-display);font-size:2.4rem;color:var(--brass);line-height:.9}
.box .t{font-weight:800;font-size:1rem;line-height:1.2}
.box .s{font-size:.8rem;color:var(--muted);line-height:1.3}
.box .kind{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--brass)}
.box .st{margin-top:auto;font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.box.open{border-color:var(--sea);background:linear-gradient(160deg,color-mix(in srgb,var(--sea) 18%,var(--steel-2)),var(--steel))}
.box.open .st{color:var(--sea)}
.reward{font-family:var(--f-mono);font-weight:700;font-size:2.2rem;color:var(--sea);line-height:1}
.lockpanel{margin-top:18px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;border:2px dashed var(--brass-2);border-radius:14px;padding:14px 18px}
.slots{display:flex;flex-wrap:wrap;gap:8px}
.slot{width:2.6rem;height:3.2rem;border-radius:8px;border:2px solid var(--edge);display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:1.5rem;background:#0008;color:var(--sea)}

/* prueba */
.pz-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:end}
.pz-head h2{font-size:clamp(2rem,5vw,3.2rem)}
.task{color:var(--muted);max-width:70ch;margin-top:6px}
.pool{display:flex;flex-wrap:wrap;gap:8px;padding:12px;border:2px dashed var(--edge);border-radius:14px;min-height:4rem;background:#0004}
.pool:empty::before{content:"Todas las tarjetas están colocadas. Pulsa Comprobar.";color:var(--muted);font-size:.9rem}
.chip{border:2px solid var(--edge);background:var(--steel-2);border-radius:10px;padding:.5rem .75rem;font-size:.9rem;font-weight:600;text-align:left;line-height:1.3;max-width:100%}
.chip:hover{border-color:var(--brass)}
.chip.sel{border-color:var(--brass);background:color-mix(in srgb,var(--brass) 22%,var(--steel-2));box-shadow:0 0 0 3px color-mix(in srgb,var(--brass) 35%,transparent)}
.chip.bad{border-color:var(--bad);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.buckets{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.bucket{border:2px solid var(--edge);border-radius:14px;background:var(--steel);padding:12px;display:flex;flex-direction:column;gap:8px;min-height:8rem;text-align:left}
.bucket.target{border-color:var(--brass);cursor:pointer}
.bucket.target:hover{background:color-mix(in srgb,var(--brass) 10%,var(--steel))}
.bucket h3{font-family:var(--f-body);font-weight:800;font-size:1rem;letter-spacing:0;line-height:1.25}
.bucket .in{display:flex;flex-direction:column;gap:6px}
.bucket .in .chip{font-size:.85rem}
/* rellenar huecos */
.doc{background:#F3EEDF;color:#1C1A14;border-radius:6px;padding:20px 24px;font-size:1.08rem;line-height:2.3;box-shadow:0 10px 30px #0008;max-width:75ch}
.gap{display:inline-flex;align-items:center;min-width:8.5rem;min-height:2rem;vertical-align:middle;border:2px dashed #8A7B57;border-radius:8px;padding:0 6px;margin:0 2px;cursor:pointer;background:#0000}
.gap.target{border-color:#A87412;background:#E9D9A6}
.gap .chip{background:#1E3446;color:var(--text);padding:.2rem .55rem;font-size:.9rem}
/* ordenar */
.steps{display:grid;gap:8px;max-width:820px}
.step{display:grid;grid-template-columns:3rem 1fr;gap:10px;align-items:center;border:2px solid var(--edge);border-radius:12px;background:var(--steel);padding:8px 10px;min-height:3.6rem;text-align:left}
.step.target{border-color:var(--brass);cursor:pointer}
.step .num{font-family:var(--f-display);font-size:1.8rem;color:var(--brass);text-align:center}
.step .in .chip{width:100%}
/* elegir una opción por grupo */
.groups{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr))}
.group{border:2px solid var(--edge);border-radius:14px;background:var(--steel);padding:12px 14px;display:grid;gap:8px}
.group.bad{border-color:var(--bad);animation:shake .4s}
.group h3{font-family:var(--f-body);font-weight:800;font-size:1rem;letter-spacing:0;line-height:1.3}
.opts{display:grid;gap:6px}
.opt{border:2px solid var(--edge);background:var(--steel-2);border-radius:10px;padding:.5rem .7rem;text-align:left;font-size:.9rem;font-weight:600}
.opt:hover{border-color:var(--brass)}
.opt[aria-pressed="true"]{border-color:var(--brass);background:color-mix(in srgb,var(--brass) 22%,var(--steel-2))}
.msg{min-height:1.6rem;font-weight:700}
.msg.bad{color:var(--bad)} .msg.ok{color:var(--ok)} .msg.info{color:var(--muted);font-weight:500}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.hintbox{border-left:4px solid var(--sea);background:color-mix(in srgb,var(--sea) 10%,transparent);padding:10px 14px;border-radius:0 10px 10px 0;font-size:.92rem}
.solved{border:2px solid var(--sea);border-radius:16px;padding:22px;display:grid;gap:10px;justify-items:start;background:color-mix(in srgb,var(--sea) 8%,var(--steel))}
.solved .reward{font-size:4rem}

/* cerraduras */
.lockv{display:grid;grid-template-columns:1fr minmax(0,320px);gap:24px;align-items:start}
.lockv h2{font-size:clamp(2rem,5vw,3.2rem)}
.wheel{aspect-ratio:1;max-width:320px;width:100%;border-radius:50%;border:10px solid var(--brass-2);background:repeating-conic-gradient(var(--steel-2) 0 15deg,var(--steel) 15deg 30deg);display:grid;place-items:center;box-shadow:inset 0 0 0 14px #0006,0 0 40px #0008}
.wheel .hub{width:42%;aspect-ratio:1;border-radius:50%;background:var(--brass);display:grid;place-items:center;font-family:var(--f-display);font-size:2.6rem;color:#1a1405}
.wheel.spin{animation:spin 1.4s cubic-bezier(.4,1.6,.5,1)}
@keyframes spin{to{transform:rotate(540deg)}}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:300px}
.keypad button{border:2px solid var(--edge);background:var(--steel-2);border-radius:10px;padding:.8rem 0;font-family:var(--f-mono);font-weight:700;font-size:1.3rem}
.keypad button:hover{border-color:var(--brass)}
.code{display:flex;flex-wrap:wrap;gap:8px;margin-block:10px 14px}
.dials{display:flex;gap:10px;margin-block:12px 16px}
.dial{display:grid;gap:4px;justify-items:center}
.dial button{border:2px solid var(--edge);background:var(--steel-2);border-radius:8px;width:3.4rem;padding:.2rem 0;font-size:1rem}
.dial .face{width:3.4rem;height:4rem;border-radius:10px;border:3px solid var(--brass-2);background:linear-gradient(#000,#1d2f3e 45%,#1d2f3e 55%,#000);display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:2rem;color:var(--brass)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;margin-block:12px}
.tile{width:3rem;height:3.4rem;border-radius:8px;border:2px solid var(--brass-2);background:#F3EEDF;color:#1C1A14;font-family:var(--f-mono);font-weight:700;font-size:1.6rem}
.tile:disabled{opacity:.2}

/* escenas dibujadas */
.scene{position:relative;width:100%;aspect-ratio:1000/560;border-radius:16px;overflow:hidden;border:2px solid var(--edge);margin-top:12px;background:#0A1620;touch-action:none}
.scene svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.spot{position:absolute;border:2px dashed transparent;border-radius:12px;background:transparent;padding:0;z-index:1}
.spot:hover,.spot:focus-visible{border-color:var(--brass);background:color-mix(in srgb,var(--brass) 14%,transparent)}
.spot .lab{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);font-size:clamp(.6rem,1.4vw,.8rem);font-weight:800;background:#000d;color:var(--text);padding:.15rem .5rem;border-radius:6px;white-space:nowrap;pointer-events:none}
.spot.done{border:2px solid var(--sea);background:color-mix(in srgb,var(--sea) 12%,transparent)}
.spot.done .lab{color:var(--sea)}
.spot.door .lab{color:var(--brass);left:auto;right:2px;transform:none}
.scene.dark::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;background:radial-gradient(circle var(--r,120px) at var(--x,12%) var(--y,80%),transparent 0,rgba(2,6,10,.45) 55%,rgba(2,6,10,.985) 100%)}
.scene.dark .spot:not(.lit):not(.done){border-color:transparent;background:transparent}
.scene.dark .spot:not(.lit):not(.done) .lab{display:none}
.scene.dark .spot.done{z-index:3}
.found{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.found button,.found span{border:1.5px solid var(--edge);background:var(--steel);border-radius:999px;padding:.3rem .8rem;font-size:.82rem;font-weight:700}
.found .ok{border-color:var(--sea);color:var(--sea)}
.found .no{color:var(--muted);font-weight:500}
/* pasillo de láseres */
.corr{position:relative;width:100%;max-width:900px;aspect-ratio:900/300;border-radius:14px;overflow:hidden;border:2px solid var(--edge);background:#060D13}
.corr svg{width:100%;height:100%;display:block}
.beam{stroke:#FF3B3B;stroke-width:4;filter:drop-shadow(0 0 6px #FF3B3B);transition:opacity .4s}
.beam.off{opacity:.06}
.lq{display:grid;gap:12px;max-width:900px}
.lq .q{font-size:clamp(1.2rem,3vw,1.7rem);font-weight:800;line-height:1.25;min-height:4.2rem}
.lq .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lq .row button{font-size:1.2rem;padding:1rem}
.lbar{height:10px;border-radius:99px;background:var(--steel-2);overflow:hidden;max-width:900px}
.lbar i{display:block;height:100%;background:var(--bad);width:100%;transition:width .25s linear}
/* personajes */
.cast{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.who{border:2px solid var(--edge);border-radius:14px;background:var(--steel);padding:14px;display:grid;gap:8px;align-content:start}
.who.ok{border-color:var(--sea)}
.who .top{display:flex;gap:10px;align-items:center}
.ava{width:3.2rem;height:3.2rem;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:1.4rem;color:#0C1822;background:var(--c);flex:none;border:3px solid #0006}
.who b{display:block;font-size:1rem}
.who small{display:block;color:var(--muted);font-size:.8rem;line-height:1.25}
.bubble{background:#F3EEDF;color:#1C1A14;border-radius:12px;padding:10px 12px;font-size:.92rem;line-height:1.35;position:relative;font-weight:600}
.bubble::before{content:"";position:absolute;left:18px;top:-8px;border:8px solid transparent;border-top:0;border-bottom-color:#F3EEDF}
.truth{font-family:var(--f-mono);font-size:.72rem;color:var(--sea)}
.who .row{display:flex;gap:8px;flex-wrap:wrap}
.who .row .btn{padding:.45rem .9rem;font-size:.85rem}

/* final */
.end{display:grid;gap:14px;max-width:720px}
.end h1{font-size:clamp(3rem,9vw,5.5rem)}
.end .win{color:var(--sea)} .end .lose{color:var(--bad)}
.stats{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.stats li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--edge);padding-block:5px}
.stats span:last-child{font-family:var(--f-mono)}
.toast{font-family:var(--f-mono);font-size:.8rem;color:var(--ok);min-height:1.2rem}
.flash{position:fixed;inset:0;pointer-events:none;z-index:30;background:var(--bad);opacity:0}
.flash.go{animation:fl .5s}
@keyframes fl{0%{opacity:.35}100%{opacity:0}}

@media (max-width:900px){
  .intro,.lockv{grid-template-columns:1fr}
  .boxes{grid-template-columns:repeat(2,minmax(0,1fr))}
  .box{min-height:10rem}
  .plan{gap:6px}
  .room{padding:8px 10px}
  .room b{font-size:1rem}
  .room span{font-size:.7rem}
  .room .eyebrow{display:none}
  .doc{padding:16px;font-size:1rem}
}
@media (prefers-reduced-motion:reduce){.chip.bad,.group.bad,.wheel.spin,.clock.low,.flash.go{animation:none}}
</style>

<div class="app" lang="es">
  <header class="bar">
    <div class="brand">ESCAPE OFFSHORE<small>UP 1 · El Euromercado</small></div>
    <div class="hud" id="hud"><button class="mute" id="mute" aria-pressed="true">Sonido: sí</button></div>
  </header>
  <main id="view"></main>
</div>
<div class="flash" id="flash"></div>

<script>
(function(){
'use strict';
/* ---------- NIVELES ---------- */
const HINT_WAIT=60; // segundos dentro de una prueba antes de poder pedir su pista
const LEVELS={
  facil:{name:'Fácil',time:25*60,pen:20,hintCost:0,showWrong:true,desc:'25 minutos · menos tarjetas · se marcan los errores · la pista no cuesta tiempo'},
  dificil:{name:'Difícil',time:20*60,pen:45,hintCost:60,showWrong:false,desc:'20 minutos · más tarjetas · solo se dice cuántos errores hay · la pista cuesta 60 s'}
};

/* ---------- CONTENIDO (temario UP 1: El Euromercado) ----------
   Tipos de prueba: sort (clasificar), fill (rellenar huecos), order (ordenar pasos), pick (elegir una opción por grupo).
   lv: 'b' = los dos niveles, 'd' = solo en el nivel difícil. */
const ROOMS=[
 {n:1,name:'La recepción',sub:'Definición, características, objetivos y áreas',lock:'num',
  lockText:'Candado de números: los dígitos de las pruebas 1 a 4, en orden.',
  puzzles:[
   {id:'1a',kind:'Rellenar huecos',type:'fill',title:'La ficha del cliente',sub:'Definición y características',reward:'6',why:'El Euromercado tiene 6 características.',
    task:'Completa la ficha del Euromercado con las palabras que faltan.',
    text:'El Euromercado pertenece al mercado financiero {internacional}, donde se realizan operaciones en {divisas} distintas a las del {país} donde está situado el mercado. Es un mercado {mayorista}: operan gobiernos, instituciones y grandes empresas, tanto {residentes} como no residentes. Está autorizado por el {Banco Central} de cada país.',
    distract:['minorista','nacional','Tesoro'],
    hint:'Si es un mercado de gobiernos y grandes empresas, no puede ser «minorista».'},
   {id:'1b',kind:'Verdadero o falso',type:'sort',title:'El expediente',sub:'Objetivos y características',reward:'3',why:'El Euromercado tiene 3 objetivos: diversificar las fuentes de financiación, eludir la jurisdicción y distribuir el riesgo.',
    task:'Clasifica cada afirmación como verdadera o falsa.',
    buckets:[{id:'V',t:'Verdadero'},{id:'F',t:'Falso'}],
    items:[
     {t:'Uno de sus objetivos es diversificar las fuentes de financiación.',a:'V',lv:'b'},
     {t:'Uno de sus objetivos es concentrar todo el riesgo en un solo país.',a:'F',lv:'b',why:'Busca distribuir el riesgo.'},

let soundOn=true; try{soundOn=localStorage.getItem('escape-snd')!=='off'}catch(e){}
let AC=null;
function ctx(){if(!soundOn)return null;try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();}if(AC.state==='suspended')AC.resume();return AC;}catch(e){return null;}}
function tone(f,d,o){const a=ctx();if(!a)return;o=o||{};const t=a.currentTime+(o.at||0),os=a.createOscillator(),g=a.createGain();os.type=o.type||'sine';os.frequency.setValueAtTime(f,t);if(o.f2)os.frequency.exponentialRampToValueAtTime(o.f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(o.v||.15,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);os.connect(g);g.connect(a.destination);os.start(t);os.stop(t+d+.05);}
const SFX={
  tap:()=>tone(660,.06,{type:'triangle',v:.08}),
  drop:()=>tone(330,.08,{type:'triangle',v:.1}),
  bad:()=>{tone(150,.35,{type:'sawtooth',v:.12});tone(110,.4,{type:'square',v:.06,at:.05});},
  open:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,.25,{type:'triangle',v:.12,at:i*.09}));tone(90,.3,{v:.3,at:.45,f2:50});},
  lock:()=>{tone(120,.15,{type:'square',v:.15});tone(80,.4,{v:.3,at:.12,f2:40});[392,523,784].forEach((f,i)=>tone(f,.3,{type:'triangle',v:.1,at:.3+i*.1}));},
  alarm:()=>{[0,.3,.6].forEach(at=>{tone(880,.22,{type:'square',v:.07,at});tone(660,.22,{type:'square',v:.07,at:at+.15});});},
  win:()=>{[392,523,659,784,1047].forEach((f,i)=>tone(f,.4,{type:'sawtooth',v:.08,at:i*.12}));[523,659,784].forEach(f=>tone(f,1.4,{type:'triangle',v:.06,at:.7}));}
};

const $=s=>document.querySelector(s), view=$('#view');
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const fmt=s=>{s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};
let G=null, ticker=null, pick={level:'facil',mode:'grupo'};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const inLevel=x=>G.level==='dificil'||x.lv==='b';
// Prepara cada prueba para el nivel elegido: tarjetas, casillas y grupos
function build(p){
  if(p.type==='fill'){
    const words=[];const html=p.text.replace(/\{([^}]+)\}/g,(m,w)=>{words.push(w);return '\u0000'+(words.length-1)+'\u0000';});
    const items=words.map((w,i)=>({t:w,a:'h'+i}));
    if(G.level==='dificil') p.distract.forEach(w=>items.push({t:w,a:null}));
    return {items,buckets:words.map((w,i)=>({id:'h'+i,t:''})),cap:true,parts:html.split('\u0000')};
  }
  if(p.type==='order'){
    const items=p.items.filter(inLevel);
    return {items,buckets:items.map((x,i)=>({id:String(i+1),t:(i+1)+'º'})),cap:true};
  }
  if(p.type==='laser') return {deck:p.qs,need:G.level==='dificil'?8:6,secs:G.level==='dificil'?40:50};
  if(p.type==='talk'){const cast=p.cast.filter(inLevel);return {cast,liar:Math.floor(Math.random()*cast.length),heard:{},cleared:{}};}
  if(p.type==='pick'){
    return {groups:p.groups.filter(inLevel).map(g=>{const idx=shuffle(g.o.map((o,i)=>i));return {q:g.q,o:idx.map(i=>g.o[i]),a:idx.indexOf(g.a)};})};
  }
  return {items:p.items.filter(inLevel),buckets:p.buckets,cap:false};
}
function newGame(){
  G={level:pick.level,mode:pick.mode,team:(($('#team')||{}).value||'').trim(),t0:Date.now(),extra:0,pen:0,errors:0,hints:0,
     room:1,opened:{},solved:{},seen:{},lz:null,st:{},msg:{},alarmed:false,over:false,entered:'',dial:[0,0,0,0],tiles:[],cur:null,enter:0};
  ALL.forEach(p=>{
    const b=build(p);
    G.st[p.id]={...b,order:b.items?shuffle(b.items.map((it,i)=>({...it,k:p.id+'-'+i}))):null,place:{},sel:null,bad:{},choice:{},badg:{},hintUsed:false,hintShown:false,spent:0};
  });
  G.tiles=shuffle(WORD3.split('').map((c,i)=>({c,i})));
  clearInterval(ticker); ticker=setInterval(tick,250);
}
function remaining(){const L=LEVELS[G.level];return L.time+G.extra-(Date.now()-G.t0)/1000-G.pen;}
function spent(id){const S=G.st[id];return S.spent+(G.cur===id?(Date.now()-G.enter)/1000:0);}
function leave(){if(G&&G.cur){G.st[G.cur].spent=spent(G.cur);G.cur=null;}}
function tick(){
  if(!G||G.over) return;
  const r=remaining(), c=$('#clock');
  if(c){c.textContent=fmt(r);c.classList.toggle('low',r<=60);}
  if(r<=60&&!G.alarmed){G.alarmed=true;SFX.alarm();}
  const h=$('#hint');
  if(h&&G.cur){const S=G.st[G.cur], w=HINT_WAIT-spent(G.cur);
    if(S.hintUsed){h.disabled=true;h.textContent='Pista usada';}
    else if(w>0){h.disabled=true;h.textContent='Pista disponible en '+fmt(w);}
    else {h.disabled=false;h.textContent='Pedir la pista'+(LEVELS[G.level].hintCost?' (−'+LEVELS[G.level].hintCost+' s)':'');}
  }
  if(G.lz&&G.lz.running){const lr=(G.lz.end-Date.now())/1000,S=G.st['2l'],bar=$('#lbar'),lt=$('#lt');
    if(bar) bar.style.width=Math.max(0,lr/S.secs*100)+'%'; if(lt) lt.textContent='Tiempo del pasillo: '+Math.max(0,Math.ceil(lr))+' s';
    if(lr<=0){laserFail();}}
  if(r<=0){G.over=true;G.lz=null;leave();end(false);}
}
function penalty(s){G.pen+=s;G.errors++;const f=$('#flash');f.classList.remove('go');void f.offsetWidth;f.classList.add('go');tick();}
function hud(){
  const L=G?LEVELS[G.level]:null;
  $('#hud').innerHTML=(G?'<span class="pill">'+esc(G.team||(G.mode==='solo'?'En solitario':'Equipo'))+' · '+L.name+'</span><span class="pill">Sala '+Math.min(G.room,3)+'/3</span><span class="clock" id="clock">'+fmt(remaining())+'</span>':'')
    +'<button class="mute" id="mute" aria-pressed="'+soundOn+'">'+(soundOn?'Sonido: sí':'Sonido: no')+'</button>';
  $('#mute').onclick=()=>{soundOn=!soundOn;try{localStorage.setItem('escape-snd',soundOn?'on':'off')}catch(e){}hud();};
}
function plan(){
  return '<div class="plan">'+ROOMS.map(r=>{const cls=G.opened[r.n]?'done':(r.n===G.room?'cur':(r.n>G.room?'locked':''));
    return '<div class="room '+cls+'"><span class="eyebrow">Sala '+r.n+'</span><b>'+esc(r.name)+'</b><span>'+(G.opened[r.n]?'Superada':r.n===G.room?'Estáis aquí':'Cerrada')+'</span></div>';}).join('')+'</div>';
}

function hall(noScroll){
  leave(); hud();
  const R=ROOMS[G.room-1], SC=SCENES[R.n];
  if(R.n===2&&!G.solved['2l']){corridor();return;}
  const letters=R.puzzles.filter(p=>p.reward.length===1);
  const got=letters.map(p=>G.solved[p.id]?p.reward:'·');
  const all=R.puzzles.every(p=>G.solved[p.id]);
  const spot=(id,c,cls,lab)=>'<button class="spot'+cls+'" data-id="'+id+'" style="left:'+c[0]+'%;top:'+c[1]+'%;width:'+c[2]+'%;height:'+c[3]+'%" aria-label="'+esc(lab)+'"><span class="lab">'+esc(lab)+'</span></button>';
  const spots=Object.entries(SC.spots).map(([id,c])=>{const p=ALL.find(x=>x.id===id),d=G.solved[id];return spot(id,c,d?' done':'',(d?'✓ ':'')+c[4]+(d?' · '+p.reward:''));}).join('')+spot('door',SC.door,' door',SC.door[4]);
  const items=Object.entries(SC.spots).map(([id,c])=>({id,name:c[4],p:ALL.find(x=>x.id===id)}));
  const list=SC.dark
    ? '<div class="found"><span class="no">Objetos encontrados: '+items.filter(it=>G.seen[it.id]).length+' de '+items.length+'</span>'+items.filter(it=>G.seen[it.id]).map(it=>'<button class="'+(G.solved[it.id]?'ok':'')+'" data-id="'+it.id+'">'+esc(it.name)+(G.solved[it.id]?' · '+it.p.reward:'')+'</button>').join('')+'</div>'
    : '<div class="found">'+items.map(it=>'<button class="'+(G.solved[it.id]?'ok':'')+'" data-id="'+it.id+'">'+esc(it.name)+' · '+esc(it.p.title)+(G.solved[it.id]?' · '+it.p.reward:'')+'</button>').join('')+'</div>';
  const keyInfo=R.n===3?'<span class="pill" style="margin-left:8px">Llave: '+(G.solved['3e']?'sí':'no')+'</span>':'';
  const help=SC.dark?'Se ha ido la luz. Moved el ratón (o el dedo) para alumbrar con la linterna y encontrad los objetos de la sala.':'Pinchad en los objetos de la sala para encontrar las pruebas. '+(R.n===3?'La caja fuerte está en la pared.':'La cerradura está en la puerta.');
  view.innerHTML='<section class="hall">'+plan()+'<p class="eyebrow" style="margin-top:16px">Sala '+R.n+' de 3 · '+esc(R.sub)+'</p><h2>'+esc(R.name)+'</h2><p class="task">'+help+'</p>'
   +'<div class="scene'+(SC.dark?' dark':'')+'" id="scene">'+SC.svg+spots+'</div>'+list
   +'<div class="lockpanel"><div><p class="eyebrow">'+esc(R.lockText)+'</p><div class="slots" style="margin-top:8px">'+got.map(d=>'<span class="slot">'+d+'</span>').join('')+keyInfo+'</div></div><button class="btn sea" id="lockb"'+(all?'':' disabled')+'>'+(all?'Ir a la cerradura':'Resolved todas las pruebas de la sala')+'</button></div><p class="msg info" id="msg"></p></section>';
  const sc=$('#scene');
  const open=id=>{
    if(id==='door'){ if(all){SFX.tap();lock();} else {$('#msg').textContent='La cerradura no se abre todavía: os faltan pruebas de esta sala.';SFX.bad();} return; }
    SFX.tap(); puzzle(id);
  };
  sc.onclick=e=>{const b=e.target.closest('.spot'); if(!b) return;
    if(SC.dark&&!b.classList.contains('lit')&&!b.classList.contains('done')) return;
    open(b.dataset.id);};
  view.querySelector('.found').onclick=e=>{const b=e.target.closest('button'); if(b) open(b.dataset.id);};
  $('#lockb').onclick=()=>{SFX.tap();lock();};
  if(SC.dark){
    const light=(x,y)=>{const r=sc.getBoundingClientRect(), rad=Math.max(70,Math.min(140,r.width*.12));
      sc.style.setProperty('--x',(x-r.left)+'px');sc.style.setProperty('--y',(y-r.top)+'px');sc.style.setProperty('--r',rad+'px');
      let changed=false;
      sc.querySelectorAll('.spot').forEach(s=>{const q=s.getBoundingClientRect(),cx=q.left+q.width/2,cy=q.top+q.height/2;
        const near=Math.hypot(cx-x,cy-y)<rad+Math.min(q.width,q.height)/2;
        s.classList.toggle('lit',near);
        if(near&&s.dataset.id!=='door'&&!G.seen[s.dataset.id]){G.seen[s.dataset.id]=true;changed=true;}});
      if(changed){SFX.tap();const keep=[x,y];hall(true);const n=$('#scene');if(n){const ev=n.getBoundingClientRect();n.style.setProperty('--x',(keep[0]-ev.left)+'px');n.style.setProperty('--y',(keep[1]-ev.top)+'px');n.style.setProperty('--r',rad+'px');n.querySelectorAll('.spot').forEach(s=>{const q=s.getBoundingClientRect();s.classList.toggle('lit',Math.hypot(q.left+q.width/2-keep[0],q.top+q.height/2-keep[1])<rad+Math.min(q.width,q.height)/2);});}}
    };
    sc.onpointermove=e=>light(e.clientX,e.clientY);
    sc.onpointerdown=e=>light(e.clientX,e.clientY);
    sc.querySelectorAll('.spot').forEach(s=>s.onfocus=()=>{const q=s.getBoundingClientRect();light(q.left+q.width/2,q.top+q.height/2);});
  }
  if(!noScroll) window.scrollTo({top:0});
}
/* ---------- PASILLO DE LÁSERES ---------- */
function corrSvg(n,off){
  let beams='';
  for(let i=0;i<n;i++){const y=60+i*(190/Math.max(1,n-1)), tilt=(i%2?1:-1)*28;
    beams+='<line class="beam'+(i<off?' off':'')+'" x1="150" y1="'+(y-tilt)+'" x2="750" y2="'+(y+tilt)+'"/>';}
  return '<div class="corr"><svg viewBox="0 0 900 300" aria-hidden="true"><polygon points="0,0 150,40 150,260 0,300" fill="#122230"/><polygon points="900,0 750,40 750,260 900,300" fill="#122230"/><rect x="150" y="40" width="600" height="220" fill="#0B1620"/><polygon points="0,300 150,260 750,260 900,300" fill="#0F1D29"/>'
   +'<rect x="400" y="80" width="100" height="180" fill="#152634" stroke="#D2AE57" stroke-width="4"/><text x="450" y="70" text-anchor="middle" fill="#D2AE57" font-family="JetBrains Mono,monospace" font-size="16">SALA DE MERCADOS</text>'+beams+'</svg></div>';
}
function corridor(){
  leave(); hud();
  const S=G.st['2l'];
  view.innerHTML='<section class="laser">'+plan()+'<p class="eyebrow" style="margin-top:16px">Pasillo entre la recepción y la sala de mercados</p><h2 style="font-size:clamp(2rem,5vw,3.2rem)">El pasillo de láseres</h2>'
   +'<p class="task">Al abrir el candado saltan las alarmas: el pasillo se llena de láseres. Para cruzar, acertad '+S.need+' preguntas de verdadero o falso en '+S.secs+' segundos. Cada acierto apaga un láser y cada fallo resta tiempo del reloj general. Si se acaba el tiempo del pasillo, se vuelve a empezar con otras preguntas.</p>'
   +corrSvg(S.need,0)+'<div class="actions" style="margin-top:14px"><button class="btn" id="go">Empezar a cruzar</button></div></section>';
  $('#go').onclick=()=>{ctx();laserStart();};
  window.scrollTo({top:0});
}
function laserStart(){
  const S=G.st['2l'];
  G.lz={running:true,end:Date.now()+S.secs*1000,ok:0,qi:0,deck:shuffle(S.deck),msg:''};
  SFX.alarm(); laserView();
}
function laserView(){
  const S=G.st['2l'], Z=G.lz, q=Z.deck[Z.qi%Z.deck.length];
  view.innerHTML='<section class="laser" style="display:grid;gap:12px">'+'<p class="eyebrow">Pasillo de láseres · láseres apagados '+Z.ok+' de '+S.need+'</p>'
   +corrSvg(S.need,Z.ok)+'<div class="lbar"><i id="lbar"></i></div><p class="eyebrow" id="lt"></p>'
   +'<div class="lq"><p class="q">'+esc(q.t)+'</p><div class="row"><button class="btn" data-v="1">Verdadero</button><button class="btn ghost" data-v="0">Falso</button></div></div>'
   +'<p class="msg '+(Z.msgc||'info')+'" id="msg">'+esc(Z.msg||'')+'</p></section>';
  view.querySelector('.lq .row').onclick=e=>{const b=e.target.closest('button'); if(!b||!G.lz||!G.lz.running) return;
    const v=b.dataset.v==='1';
    if(v===q.a){Z.ok++;Z.msg='¡Láser apagado!';Z.msgc='ok';tone(1200,.08,{type:'square',v:.06});
      if(Z.ok>=S.need){G.lz=null;G.solved['2l']=true;SFX.open();solvedView(ALL.find(x=>x.id==='2l'));return;}}
    else {SFX.bad();penalty(LEVELS[G.level].pen);Z.msg='Fallo: el láser sigue encendido. −'+LEVELS[G.level].pen+' s.';Z.msgc='bad';}
    Z.qi++; laserView();};
  tick();
}
function laserFail(){
  const L=LEVELS[G.level]; G.lz=null; SFX.alarm(); penalty(L.pen);
  view.innerHTML='<section class="laser" style="display:grid;gap:12px"><p class="eyebrow">Pasillo de láseres</p><h2 style="font-size:clamp(2rem,5vw,3.2rem);color:var(--bad)">¡Os ha detectado un láser!</h2><p class="task">Se acabó el tiempo del pasillo. −'+L.pen+' s del reloj general. Volved a intentarlo: las preguntas cambian.</p>'
   +corrSvg(G.st['2l'].need,0)+'<div class="actions"><button class="btn" id="go">Volver a cruzar</button></div></section>';
  $('#go').onclick=laserStart;
}
/* ---------- INTERROGATORIO ---------- */
function talkView(id){
  const p=ALL.find(x=>x.id===id), S=G.st[id];
  if(G.cur!==id){leave();G.cur=id;G.enter=Date.now();}
  hud();
  const ini=n=>n.split(' ').map(w=>w[0]).join('');
  view.innerHTML='<section class="pz"><div class="pz-head"><div><p class="eyebrow">Sala '+p.room+' · '+esc(p.kind)+' · '+esc(p.sub)+'</p><h2>'+esc(p.title)+'</h2><p class="task">'+esc(p.task)+'</p></div><button class="btn ghost" id="back">Volver a la sala</button></div>'
   +'<div class="cast">'+S.cast.map((c,i)=>'<div class="who'+(S.cleared[i]?' ok':'')+'"><div class="top"><span class="ava" style="--c:'+c.c+'">'+ini(c.n)+'</span><div><b>'+esc(c.n)+'</b><small>'+esc(c.r)+'</small></div></div>'
     +(S.heard[i]?'<p class="bubble">«'+esc(i===S.liar?c.f:c.v)+'»</p>':'')+(S.cleared[i]?'<span class="truth">Dice la verdad</span>':'')
     +'<div class="row"><button class="btn ghost" data-h="'+i+'">'+(S.heard[i]?'Escuchar otra vez':'Escuchar')+'</button><button class="btn" data-a="'+i+'"'+(S.cleared[i]?' disabled':'')+'>Acusar</button></div></div>').join('')+'</div>'
   +'<p class="msg '+((G.msg[id]||{}).c||'info')+'" id="msg">'+esc((G.msg[id]||{}).t||'')+'</p>'
   +'<div class="actions"><button class="btn ghost" id="hint" disabled>Pista</button></div>'
   +(S.hintShown?'<p class="hintbox"><b>Pista:</b> '+esc(p.hint)+'</p>':'')+'</section>';
  tick();
  view.querySelector('.cast').onclick=e=>{const b=e.target.closest('button'); if(!b) return;
    if(b.dataset.h!==undefined){S.heard[+b.dataset.h]=true;SFX.tap();talkView(id);return;}
    const i=+b.dataset.a, L=LEVELS[G.level];
    if(i===S.liar){G.solved[id]=true;G.msg[id]=null;leave();SFX.open();solvedView(p);return;}
    SFX.bad(); penalty(L.pen);
    if(L.showWrong){S.cleared[i]=true;G.msg[id]={c:'bad',t:S.cast[i].n+' dice la verdad. −'+L.pen+' s.'};}
    else G.msg[id]={c:'bad',t:S.cast[i].n+' no es quien miente. −'+L.pen+' s.'};
    talkView(id);};
  $('#back').onclick=hall;
  $('#hint').onclick=()=>hint(p);
}
function puzzle(id){
  const p=ALL.find(x=>x.id===id), S=G.st[id];
  if(G.solved[id]){solvedView(p);return;}
  if(p.type==='laser'){corridor();return;}
  if(p.type==='talk'){talkView(id);return;}
  if(G.cur!==id){leave();G.cur=id;G.enter=Date.now();}
  hud();
  let body='';
  const chip=it=>'<button class="chip'+(S.sel===it.k?' sel':'')+(S.bad[it.k]?' bad':'')+'" data-k="'+it.k+'">'+esc(it.t)+'</button>';
  const inB=b=>S.order.filter(it=>S.place[it.k]===b.id).map(chip).join('');
  const tg=S.sel?' target':'';
  if(p.type==='pick'){
    body='<div class="groups">'+S.groups.map((g,gi)=>'<div class="group'+(S.badg[gi]?' bad':'')+'"><h3>'+esc(g.q)+'</h3><div class="opts">'+g.o.map((o,oi)=>'<button class="opt" data-g="'+gi+'" data-o="'+oi+'" aria-pressed="'+(S.choice[gi]===oi)+'">'+esc(o)+'</button>').join('')+'</div></div>').join('')+'</div>';
  } else {
    const pool='<div class="pool" id="pool">'+S.order.filter(it=>!S.place[it.k]).map(chip).join('')+'</div>';
    if(p.type==='fill') body=pool+'<div class="doc">'+S.parts.map((t,i)=>i%2===0?esc(t):'<span class="gap bucket'+tg+'" data-b="h'+t+'" role="button" tabindex="0"><span class="in">'+inB({id:'h'+t})+'</span></span>').join('')+'</div>';
    else if(p.type==='order') body=pool+'<div class="steps">'+S.buckets.map(b=>'<div class="step bucket'+tg+'" data-b="'+b.id+'" role="button" tabindex="0"><span class="num">'+b.id+'</span><div class="in">'+inB(b)+'</div></div>').join('')+'</div>';
    else body=pool+'<div class="buckets">'+S.buckets.map(b=>'<div class="bucket'+tg+'" data-b="'+b.id+'" role="button" tabindex="0"><h3>'+esc(b.t)+'</h3><div class="in">'+inB(b)+'</div></div>').join('')+'</div>';
  }
  const how=p.type==='pick'?'Toca una opción en cada grupo.':'Toca una tarjeta y después su sitio. Para devolverla, tócala otra vez.';
  view.innerHTML='<section class="pz"><div class="pz-head"><div><p class="eyebrow">Sala '+p.room+' · '+esc(p.kind)+' · '+esc(p.sub)+'</p><h2>'+esc(p.title)+'</h2><p class="task">'+esc(p.task)+' '+how+'</p></div>'
   +'<button class="btn ghost" id="back">Volver a la sala</button></div>'+body
   +'<p class="msg '+((G.msg[id]||{}).c||'info')+'" id="msg">'+esc((G.msg[id]||{}).t||'')+'</p>'
   +'<div class="actions"><button class="btn" id="chk">Comprobar</button><button class="btn ghost" id="hint" disabled>Pista</button></div>'
   +(S.hintShown?'<p class="hintbox"><b>Pista:</b> '+esc(p.hint)+'</p>':'')+'</section>';
  tick();
  const root=view.querySelector('.pz');
  root.onclick=e=>{
    const o=e.target.closest('.opt'); if(o){const gi=+o.dataset.g;S.choice[gi]=+o.dataset.o;S.badg={};SFX.tap();puzzle(id);return;}
    const c=e.target.closest('.chip');
    if(c){e.stopPropagation();const k=c.dataset.k;
      if(S.place[k]){delete S.place[k];S.sel=null;SFX.drop();} else {S.sel=S.sel===k?null:k;SFX.tap();}
      S.bad={};puzzle(id);return;}
    const b=e.target.closest('.bucket'); if(b) drop(b.dataset.b);
  };
  const drop=bid=>{
    if(!S.sel) return;
    if(S.cap) Object.keys(S.place).forEach(k=>{if(S.place[k]===bid)delete S.place[k];});
    S.place[S.sel]=bid; S.sel=null; SFX.drop(); puzzle(id);
  };
  view.querySelectorAll('.bucket').forEach(b=>b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();drop(b.dataset.b);}});
  $('#back').onclick=e=>{e.stopPropagation();hall();};
  $('#chk').onclick=e=>{e.stopPropagation();check(p);};
  $('#hint').onclick=e=>{e.stopPropagation();hint(p);};
}
function check(p){
  const S=G.st[p.id], L=LEVELS[G.level];
  let left, wrong;
  if(p.type==='pick'){
    left=S.groups.filter((g,i)=>S.choice[i]===undefined).length;
    wrong=S.groups.map((g,i)=>i).filter(i=>S.choice[i]!==S.groups[i].a);
  } else if(S.cap){
    const occ=b=>S.order.find(it=>S.place[it.k]===b.id);
    left=S.buckets.filter(b=>!occ(b)).length;
    wrong=S.buckets.filter(b=>occ(b)&&occ(b).a!==b.id).map(b=>occ(b));
  } else {
    left=S.order.filter(it=>!S.place[it.k]).length;
    wrong=S.order.filter(it=>S.place[it.k]!==it.a);
  }
  if(left){G.msg[p.id]={c:'info',t:p.type==='pick'?'Falta elegir en '+left+(left===1?' grupo.':' grupos.'):'Faltan '+left+(left===1?' casilla':' casillas')+' por completar.'};puzzle(p.id);return;}
  if(!wrong.length){G.solved[p.id]=true;G.msg[p.id]=null;leave();SFX.open();solvedView(p);return;}
  SFX.bad(); penalty(L.pen);
  const n=wrong.length;
  if(L.showWrong){
    if(p.type==='pick'){S.badg={};wrong.forEach(i=>{S.badg[i]=true;delete S.choice[i];});}
    else {S.bad={};wrong.forEach(it=>{delete S.place[it.k];S.bad[it.k]=true;});}
    G.msg[p.id]={c:'bad',t:(n===1?'1 respuesta estaba mal':n+' respuestas estaban mal')+(p.type==='pick'?(n===1?' (marcada en rojo).':' (marcadas en rojo).'):(n===1?' y ha vuelto arriba.':' y han vuelto arriba.'))+' −'+L.pen+' s.'};
  } else G.msg[p.id]={c:'bad',t:'Hay '+n+(n===1?' error':' errores')+'. No os decimos cuáles. −'+L.pen+' s.'};
  puzzle(p.id);
}
function hint(p){
  const S=G.st[p.id], L=LEVELS[G.level];
  if(S.hintUsed||spent(p.id)<HINT_WAIT) return;
  S.hintUsed=true; S.hintShown=true; G.hints++;
  if(L.hintCost) G.pen+=L.hintCost;
  // además de la pista, deja bien colocada una respuesta
  if(p.type==='talk'){const i=S.cast.findIndex((c,i)=>i!==S.liar&&!S.cleared[i]); if(i>=0) S.cleared[i]=true; G.msg[p.id]={c:'info',t:'Pista usada: ya sabéis de alguien que dice la verdad.'+(L.hintCost?' −'+L.hintCost+' s.':'')}; SFX.tap(); talkView(p.id); return;}
  if(p.type==='pick'){const i=S.groups.findIndex((g,i)=>S.choice[i]!==g.a); if(i>=0){S.choice[i]=S.groups[i].a;S.badg={};}}
  else {
    const it=S.cap?S.order.find(x=>x.a&&S.place[x.k]!==x.a):S.order.find(x=>S.place[x.k]!==x.a);
    if(it){ if(S.cap) Object.keys(S.place).forEach(k=>{if(S.place[k]===it.a)delete S.place[k];}); S.place[it.k]=it.a; S.bad={}; }
  }
  G.msg[p.id]={c:'info',t:'Pista usada: además, una respuesta ya está en su sitio.'+(L.hintCost?' −'+L.hintCost+' s.':'')};
  SFX.tap(); puzzle(p.id);
}
function solvedView(p){
  hud();
  const R=ROOMS[p.room-1], all=R.puzzles.every(x=>G.solved[x.id]);
  const back=p.type==='laser'?'Entrar en la sala de mercados':'Volver a la sala';
  const extra=(p.items||[]).filter(it=>it.why&&inLevel(it));
  const what=p.reward==='LLAVE'?'la llave de la caja fuerte del director':/\d/.test(p.reward)?'un papel con un número':'una ficha con una letra';
  view.innerHTML='<section class="solved"><p class="eyebrow">Sala '+p.room+' · prueba resuelta</p><h2>'+esc(p.title)+'</h2><p>Encontráis '+what+':</p><span class="reward">'+p.reward+'</span><p>'+esc(p.why)+'</p>'
   +(extra.length?'<div class="hintbox"><b>Para recordar:</b> '+extra.map(it=>esc(it.why)).join(' ')+'</div>':'')
   +'<div class="actions"><button class="btn" id="back">'+back+'</button>'+(all&&p.type!=='laser'?'<button class="btn sea" id="lockb">Ya lo tenéis todo. Ir a la cerradura</button>':'')+'</div></section>';
  $('#back').onclick=hall; const d=$('#lockb'); if(d) d.onclick=lock;
  window.scrollTo({top:0});
}
function lockFail(msg){SFX.bad();penalty(LEVELS[G.level].pen);const m=$('#msg');m.className='msg bad';m.textContent=msg+' −'+LEVELS[G.level].pen+' s.';}
function lockOpen(){
  const R=ROOMS[G.room-1]; G.opened[R.n]=true; SFX.lock();
  const w=$('#wheel'); if(w) w.classList.add('spin');
  setTimeout(()=>{ if(R.n===3){G.over=true;clearInterval(ticker);end(true);} else {G.room++;G.entered='';hall();} },1300);
}
function lock(){
  leave(); hud();
  const R=ROOMS[G.room-1];
  const got=R.puzzles.filter(p=>p.reward.length===1).map(p=>p.reward);
  let ui='';
  if(R.lock==='num'){
    ui='<p class="task">Los dígitos de las pruebas 1 a 4 de esta sala, en orden. Tenéis: <b style="font-family:var(--f-mono);color:var(--sea)">'+got.join(' ')+'</b></p>'
     +'<div class="code">'+[0,1,2,3].map(i=>'<span class="slot">'+(G.entered[i]||'')+'</span>').join('')+'</div>'
     +'<div class="keypad" id="kp">'+[1,2,3,4,5,6,7,8,9,'Borrar',0,'Abrir'].map(k=>'<button data-k="'+k+'">'+k+'</button>').join('')+'</div>';
  } else if(R.lock==='dial'){
    const L='ABEINORSU';
    ui='<p class="task">Habéis encontrado estas letras: <b style="font-family:var(--f-mono);color:var(--sea)">'+got.join(' ')+'</b>. Giradlas para formar una palabra del temario de 4 letras.</p>'
     +'<div class="dials" id="dl">'+G.dial.map((v,i)=>'<div class="dial"><button data-i="'+i+'" data-d="-1" aria-label="Letra anterior">▲</button><span class="face">'+L[v]+'</span><button data-i="'+i+'" data-d="1" aria-label="Letra siguiente">▼</button></div>').join('')+'</div>'
     +'<button class="btn" id="try">Probar la combinación</button>';
  } else {
    ui='<p class="task">La llave abre la cerradura exterior de la caja fuerte. Para la combinación, unid las 4 letras del despacho (<b style="font-family:var(--f-mono);color:var(--sea)">'+got.join(' ')+'</b>) con la palabra de la sala de mercados (<b style="font-family:var(--f-mono);color:var(--sea)">'+WORD2+'</b>). Es un bono emitido en una divisa distinta a la del país donde se vende.</p>'
     +'<div class="code">'+WORD3.split('').map((c,i)=>'<span class="slot">'+(G.entered[i]||'')+'</span>').join('')+'</div>'
     +'<div class="tiles" id="tl">'+G.tiles.map((t,j)=>'<button class="tile" data-j="'+j+'"'+(G.used&&G.used.includes(j)?' disabled':'')+'>'+t.c+'</button>').join('')+'</div>'
     +'<div class="actions"><button class="btn ghost" id="del">Borrar</button><button class="btn sea" id="try">Abrir la puerta</button></div>';
  }
  view.innerHTML='<section class="lockv"><div>'+plan()+'<p class="eyebrow" style="margin-top:16px">Sala '+R.n+' · cerradura</p><h2>'+(R.n===3?'La caja fuerte del director':'La cerradura de '+esc(R.name.toLowerCase()))+'</h2>'+ui
   +'<p class="msg" id="msg"></p><button class="btn ghost" id="back">Volver a la sala</button></div><div class="wheel" id="wheel"><div class="hub">'+(R.n===1?'123':R.n===2?'ABC':'$')+'</div></div></section>';
  $('#back').onclick=hall;
  if(R.lock==='num'){
    $('#kp').onclick=e=>{const b=e.target.closest('button');if(!b)return;const k=b.dataset.k;
      if(k==='Borrar'){G.entered=G.entered.slice(0,-1);SFX.drop();lock();return;}
      if(k==='Abrir'){ if(G.entered.length<4){$('#msg').className='msg info';$('#msg').textContent='Faltan dígitos.';return;}
        if(G.entered===CODE1){lockOpen();return;} G.entered='';lock();lockFail('Código incorrecto.');return;}
      if(G.entered.length<4){G.entered+=k;SFX.tap();lock();}};
  } else if(R.lock==='dial'){
    const L='ABEINORSU';
    $('#dl').onclick=e=>{const b=e.target.closest('button');if(!b)return;const i=+b.dataset.i;G.dial[i]=(G.dial[i]+(+b.dataset.d)+L.length)%L.length;SFX.tap();lock();};
    $('#try').onclick=()=>{const w=G.dial.map(v=>L[v]).join(''); if(w===WORD2) lockOpen(); else lockFail('«'+w+'» no abre el candado.');};
  } else {
    G.used=G.used||[];
    $('#tl').onclick=e=>{const b=e.target.closest('.tile');if(!b||G.entered.length>=WORD3.length)return;const j=+b.dataset.j;G.used.push(j);G.entered+=G.tiles[j].c;SFX.tap();lock();};
    $('#del').onclick=()=>{G.used.pop();G.entered=G.entered.slice(0,-1);SFX.drop();lock();};
    $('#try').onclick=()=>{ if(G.entered.length<WORD3.length){$('#msg').className='msg info';$('#msg').textContent='Faltan letras.';return;}
      if(G.entered===WORD3) lockOpen(); else {const w=G.entered;G.entered='';G.used=[];lock();lockFail('«'+w+'» no abre la puerta.');}};
  }
  window.scrollTo({top:0});
}
function end(win){
  clearInterval(ticker); hud();
  const r=Math.max(0,remaining()), used=LEVELS[G.level].time+G.extra-r;
  const solved=Object.keys(G.solved).length, rooms=Object.keys(G.opened).length;
  const score=(win?Math.round(r*(G.level==='dificil'?2:1)):0)+solved*50+rooms*100;
  const name=G.team||(G.mode==='solo'?'Jugador':'Equipo');
  const text=name+' '+(win?'escapó':'no escapó')+' del banco offshore (nivel '+LEVELS[G.level].name+') con '+score+' puntos.';
  view.innerHTML='<section class="end"><p class="eyebrow">'+(win?'Puerta abierta':'Tiempo agotado')+'</p>'
   +'<h1 class="'+(win?'win':'lose')+'">'+(win?'¡Habéis escapado!':'Las puertas siguen cerradas')+'</h1>'
   +'<p class="story" style="margin:0">'+(win?'La llave y la palabra EUROBONO abren la caja fuerte del director: dentro está el código de la puerta principal y salís al aire caliente de George Town con el informe de auditoría bajo el brazo.':'La inspección llega antes de que salgáis. Podéis seguir con 5 minutos extra o volver a empezar.')+'</p>'
   +'<ul class="stats"><li><span>Equipo</span><span>'+esc(name)+'</span></li><li><span>Nivel</span><span>'+LEVELS[G.level].name+'</span></li><li><span>Salas superadas</span><span>'+rooms+' / 3</span></li><li><span>Pruebas resueltas</span><span>'+solved+' / '+ALL.length+'</span></li><li><span>Tiempo usado</span><span>'+fmt(used)+'</span></li><li><span>Errores</span><span>'+G.errors+'</span></li><li><span>Pistas</span><span>'+G.hints+'</span></li><li><span>Puntuación</span><span>'+score+'</span></li></ul>'
   +'<div class="actions">'+(win?'':'<button class="btn" id="more">Seguir 5 minutos más</button>')+'<button class="btn '+(win?'':'ghost')+'" id="again">Jugar otra vez</button><button class="btn ghost" id="cp">Copiar resultado</button></div><p class="toast" id="ts" role="status"></p></section>';
  if(win) SFX.win();
  const m=$('#more'); if(m) m.onclick=()=>{G.extra+=300;G.over=false;G.alarmed=false;ticker=setInterval(tick,250);hall();};
  $('#again').onclick=intro;
  $('#cp').onclick=()=>{try{navigator.clipboard.writeText(text).then(()=>{$('#ts').textContent='Resultado copiado.';},()=>{$('#ts').textContent=text;});}catch(e){$('#ts').textContent=text;}};
}
intro();
})();
</script>
